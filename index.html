<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>美股行情</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050608;
    color:#f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

#app{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:12px;
}


/* =========================
   顶部
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding-bottom:10px;
    margin-bottom:4px;

    border-bottom:1px solid #20242a;
}

.title{
    font-size:22px;
    font-weight:800;
    letter-spacing:.2px;
}

.subtitle{
    margin-top:3px;
    font-size:10px;
    color:#78818c;
}

.clock{
    font-size:12px;
    color:#9ca5af;
    white-space:nowrap;
}


/* =========================
   美股
========================= */

.stock-list{
    width:100%;
}

.stock-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;

    min-height:48px;

    border-bottom:1px solid #20242a;
}

.stock-symbol{
    font-size:18px;
    font-weight:800;
}

.stock-price{
    text-align:center;
    font-size:17px;
    font-weight:750;
    font-variant-numeric:tabular-nums;
}

.stock-change{
    text-align:right;
    font-size:15px;
    font-weight:750;
    font-variant-numeric:tabular-nums;
}

.up{
    color:#19d889;
}

.down{
    color:#ff4d63;
}

.flat{
    color:#9aa3ad;
}


/* =========================
   指数
========================= */

.section-title{
    margin-top:10px;
    margin-bottom:5px;

    font-size:11px;
    color:#89939e;
}

.index-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.index-card{
    background:#0c0f13;
    border-radius:6px;
    padding:7px 9px;

    min-height:44px;
}

.index-name{
    font-size:10px;
    color:#8d97a2;
}

.index-value{
    margin-top:2px;
    font-size:14px;
    font-weight:750;
    font-variant-numeric:tabular-nums;
}


/* =========================
   加密货币
========================= */

.crypto-grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.crypto-card{
    background:#0c0f13;
    border-radius:6px;
    padding:7px 8px;

    min-height:55px;
}

.crypto-symbol{
    font-size:12px;
    font-weight:800;
}

.crypto-price{
    margin-top:2px;
    font-size:13px;
    font-weight:750;
    font-variant-numeric:tabular-nums;
}

.crypto-change{
    margin-top:1px;
    font-size:10px;
    font-weight:700;
}


/* =========================
   底部
========================= */

.footer{
    margin-top:8px;
    text-align:center;

    font-size:9px;
    line-height:1.5;

    color:#58616b;
}

#market-status{
    min-height:14px;
}


/* =========================
   手机
========================= */

@media(max-width:600px){

    #app{
        padding:
            9px
            9px
            12px;
    }

    .title{
        font-size:21px;
    }

    .clock{
        font-size:11px;
    }

    .stock-row{
        min-height:49px;
    }

    .stock-symbol{
        font-size:17px;
    }

    .stock-price{
        font-size:16px;
    }

    .stock-change{
        font-size:14px;
    }

    .index-grid{
        gap:6px;
    }

    .index-card{
        padding:6px 8px;
    }

    .index-value{
        font-size:13px;
    }

    .crypto-grid{
        gap:6px;
    }

    .crypto-card{
        padding:
            7px
            7px;
    }

    .crypto-symbol{
        font-size:11px;
    }

    .crypto-price{
        font-size:12px;
    }

}


/* =========================
   iPhone 6 Plus
========================= */

@media(max-width:414px){

    #app{
        padding:8px;
    }

    .header{
        padding-bottom:8px;
    }

    .title{
        font-size:20px;
    }

    .stock-row{
        min-height:47px;
    }

    .stock-symbol{
        font-size:17px;
    }

    .stock-price{
        font-size:16px;
    }

    .stock-change{
        font-size:14px;
    }

    .crypto-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:6px;
    }

    .crypto-card{
        min-height:52px;
    }

}


/* =========================
   非常小屏幕
========================= */

@media(max-width:350px){

    .stock-symbol{
        font-size:16px;
    }

    .stock-price{
        font-size:15px;
    }

    .stock-change{
        font-size:13px;
    }

}

</style>

</head>


<body>

        <div class="stock-row">

<script>


/* =========================
   Worker API
========================= */

const API =
    "https://stock-board-api.1309475064.workers.dev/";


/* =========================
   格式化价格
========================= */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================
   格式化涨跌幅
========================= */

function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }

    const n =
        Number(value);


    if(n > 0){

        return "▲ +" +
               n.toFixed(2) +
               "%";

    }


    if(n < 0){

        return "▼ " +
               n.toFixed(2) +
               "%";

    }


    return "— 0.00%";

}


/* =========================
   判断颜色
========================= */

function changeClass(value){

    if(value > 0){

        return "up";

    }


    if(value < 0){

        return "down";

    }


    return "flat";

}


/* =========================
   北京时间时钟
========================= */

function updateClock(){

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2,"0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const s =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document.getElementById(
        "clock"
    ).textContent =
        h + ":" + m + ":" + s;

}


updateClock();


setInterval(
    updateClock,
    1000
);



/* =========================
   美股市场状态
   使用纽约时间
========================= */

function updateMarketStatus(){

    const statusElement =
        document.getElementById(
            "market-status"
        );


    if(!statusElement){
        return;
    }


    const now =
        new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    "America/New_York",

                weekday:
                    "short",

                hour:
                    "numeric",

                minute:
                    "numeric",

                hour12:
                    false
            }
        ).formatToParts(now);


    const values = {};


    parts.forEach(
        part => {

            values[part.type] =
                part.value;

        }
    );


    const weekday =
        values.weekday;


    const hour =
        Number(values.hour);


    const minute =
        Number(values.minute);


    const currentMinutes =
        hour * 60 + minute;


    const openMinutes =
        9 * 60 + 30;


    const closeMinutes =
        16 * 60;


    let status;


    /*
       周末
    */

    if(
        weekday === "Sat" ||
        weekday === "Sun"
    ){

        status =
            "美股休市 · 周末";

    }


    /*
       正常交易时间
       纽约时间 09:30 - 16:00
    */

    else if(
        currentMinutes >= openMinutes &&
        currentMinutes < closeMinutes
    ){

        status =
            "美股交易中";

    }


    /*
       开盘前
    */

    else if(
        currentMinutes < openMinutes
    ){

        status =
            "美股未开盘";

    }


    /*
       收盘后
    */

    else{

        status =
            "美股已收市";

    }


    statusElement.textContent =
        status;

}


updateMarketStatus();


setInterval(
    updateMarketStatus,
    30000
);



/* =========================
   更新股票
========================= */

function updateStocks(data){

    const map = {};


    if(
        data.stocks &&
        Array.isArray(data.stocks)
    ){

        data.stocks.forEach(
            item => {

                map[item.symbol] =
                    item;

            }
        );

    }


    const rows =
        document.querySelectorAll(
            ".stock-row"
        );


    rows.forEach(
        row => {


            const symbol =
                row.querySelector(
                    ".stock-symbol"
                ).textContent.trim();


            const price =
                row.querySelector(
                    ".stock-price"
                );


            const change =
                row.querySelector(
                    ".stock-change"
                );


            const item =
                map[symbol];


            if(!item){

                return;

            }


            price.textContent =
                "$" +
                formatPrice(
                    item.price
                );


            change.textContent =
                formatPercent(
                    item.change
                );


            change.className =
                "stock-change " +
                changeClass(
                    item.change
                );

        }
    );

}



/* =========================
   更新指数
========================= */

function updateIndices(data){


    if(
        data.indices &&
        data.indices.nasdaq
    ){

        const n =
            data.indices.nasdaq;


        document.getElementById(
            "nasdaq"
        ).innerHTML =

            formatPrice(
                n.price
            ) +

            " " +

            '<span class="' +
            changeClass(n.change) +
            '">' +

            formatPercent(
                n.change
            ) +

            "</span>";

    }


    if(
        data.indices &&
        data.indices.sp500
    ){

        const s =
            data.indices.sp500;


        document.getElementById(
            "sp500"
        ).innerHTML =

            formatPrice(
                s.price
            ) +

            " " +

            '<span class="' +
            changeClass(s.change) +
            '">' +

            formatPercent(
                s.change
            ) +

            "</span>";

    }

}



/* =========================
   更新加密货币
========================= */

function updateCrypto(data){

    if(
        !data.crypto ||
        !Array.isArray(data.crypto)
    ){

        return;

    }


    const map = {};


    data.crypto.forEach(
        item => {

            map[item.symbol] =
                item;

        }
    );


    const cards =
        document.querySelectorAll(
            ".crypto-card"
        );


    cards.forEach(
        card => {


            const symbol =
                card.querySelector(
                    ".crypto-symbol"
                ).textContent.trim();


            const item =
                map[symbol];


            if(!item){

                return;

            }


            const price =
                card.querySelector(
                    ".crypto-price"
                );


            const change =
                card.querySelector(
                    ".crypto-change"
                );


            price.textContent =
                "$" +
                formatPrice(
                    item.price
                );


            change.textContent =
                formatPercent(
                    item.change
                );


            change.className =
                "crypto-change " +
                changeClass(
                    item.change
                );

        }
    );

}



/* =========================
   获取行情
========================= */

async function loadData(){

    try{


        const response =
            await fetch(

                API +
                "?t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        const data =
            await response.json();


        if(!data.success){

            console.error(
                "API error:",
                data
            );

            return;

        }


        updateStocks(
            data
        );


        updateIndices(
            data
        );


        updateCrypto(
            data
        );


        if(data.updatedAt){

            const time =
                new Date(
                    data.updatedAt
                );


            document.getElementById(
                "updated"
            ).textContent =

                time.toLocaleTimeString(
                    "zh-CN",
                    {
                        hour12:false
                    }
                );

        }


    }

    catch(error){

        console.error(
            "行情获取失败:",
            error
        );

    }

}



/* =========================
   第一次加载
========================= */

loadData();



/* =========================
   每30秒刷新一次
========================= */

setInterval(
    loadData,
    30000
);


</script>
