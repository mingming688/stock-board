<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>美股行情</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050608;
    color: #f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    padding: 10px 14px 18px;
}

/* =========================
   顶部
========================= */

.header {
    position: relative;
    width: 100%;
    padding-bottom: 8px;
    border-bottom: 1px solid #20242a;
}

.title {
    font-size: 23px;
    font-weight: 800;
    line-height: 1.2;
}

.subtitle {
    margin-top: 3px;
    color: #77808c;
    font-size: 10px;
}

.clock {
    position: absolute;
    right: 0;
    top: 2px;
    color: #aeb7c4;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

/* =========================
   股票
========================= */

.stock-list {
    width: 100%;
}

.stock-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;

    min-height: 52px;

    border-bottom: 1px solid #20242a;
}

.stock-symbol {
    font-size: 19px;
    font-weight: 800;
}

.stock-price {
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

.stock-change {
    text-align: right;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

/* =========================
   涨跌颜色
========================= */

.up {
    color: #00d084;
}

.down {
    color: #ff3b55;
}

.neutral {
    color: #9aa3ad;
}

/* =========================
   区块标题
========================= */

.section-title {
    margin-top: 10px;
    margin-bottom: 5px;

    color: #89929d;

    font-size: 12px;
    font-weight: 500;
}

/* =========================
   指数
========================= */

.index-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.index-card {
    background: #0c0f13;
    border-radius: 6px;
    padding: 8px 10px;
    min-height: 50px;
}

.index-name {
    color: #9ca5af;
    font-size: 11px;
}

.index-price {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

.index-change {
    margin-left: 4px;
    font-size: 13px;
}

/* =========================
   加密货币
========================= */

.crypto-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 8px;
}

.crypto-card {
    background: #0c0f13;
    border-radius: 6px;
    padding: 8px 9px;
    min-height: 67px;
}

.crypto-symbol {
    font-size: 13px;
    font-weight: 800;
}

.crypto-price {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

.crypto-change {
    margin-top: 1px;
    font-size: 11px;
    font-weight: 700;
}

/* =========================
   底部
========================= */

.footer {
    margin-top: 9px;
    text-align: center;
    color: #59616b;
    font-size: 10px;
    line-height: 1.5;
}

.loading {
    color: #78818d;
}

.error {
    color: #ff5b6e;
}

/* =========================
   iPhone 小屏优化
========================= */

@media (max-width: 600px) {

    body {
        padding:
            8px 10px
            calc(12px + env(safe-area-inset-bottom));
    }

    .title {
        font-size: 21px;
    }

    .clock {
        font-size: 11px;
    }

    .stock-row {
        min-height: 49px;
    }

    .stock-symbol {
        font-size: 17px;
    }

    .stock-price {
        font-size: 15px;
    }

    .stock-change {
        font-size: 13px;
    }

    .index-grid {
        gap: 6px;
    }

    .index-card {
        padding: 7px 8px;
    }

    .crypto-grid {
        gap: 6px;
    }

    .crypto-card {
        padding: 7px 7px;
    }

    .crypto-price {
        font-size: 14px;
    }

    .crypto-change {
        font-size: 10px;
    }
}

/* =========================
   极小屏幕
========================= */

@media (max-width: 360px) {

    body {
        padding-left: 8px;
        padding-right: 8px;
    }

    .stock-row {
        min-height: 47px;
    }

    .stock-symbol {
        font-size: 16px;
    }

    .stock-price {
        font-size: 14px;
    }

    .stock-change {
        font-size: 12px;
    }

    .crypto-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<!-- =========================
     顶部
========================= -->

<div class="header">

    <div class="title">
        美股行情
    </div>

    <div class="subtitle">
        iPhone 6 Plus · 自动更新
    </div>

    <div id="clock" class="clock">
        --:--:--
    </div>

</div>


<!-- =========================
     股票
========================= -->

<div id="stocks" class="stock-list">

    <div class="stock-row">
        <div class="stock-symbol">NVDA</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">TSLA</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">AAPL</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">MSTR</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">STRC</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

</div>


<!-- =========================
     指数
========================= -->

<div class="section-title">
    MARKET INDEX
</div>

<div class="index-grid">

    <div class="index-card">

        <div class="index-name">
            NASDAQ
        </div>

        <div>
            <span id="nasdaq-price"
                  class="index-price loading">
                --
            </span>

            <span id="nasdaq-change"
                  class="index-change loading">
                --
            </span>
        </div>

    </div>


    <div class="index-card">

        <div class="index-name">
            S&P 500
        </div>

        <div>
            <span id="sp500-price"
                  class="index-price loading">
                --
            </span>

            <span id="sp500-change"
                  class="index-change loading">
                --
            </span>
        </div>

    </div>

</div>


<!-- =========================
     加密货币
========================= -->

<div class="section-title">
    CRYPTO · 加密货币
</div>

<div class="crypto-grid">

    <div class="crypto-card">

        <div class="crypto-symbol">
            BTC
        </div>

        <div id="BTC-price"
             class="crypto-price loading">
            --
        </div>

        <div id="BTC-change"
             class="crypto-change loading">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            ETH
        </div>

        <div id="ETH-price"
             class="crypto-price loading">
            --
        </div>

        <div id="ETH-change"
             class="crypto-change loading">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            BNB
        </div>

        <div id="BNB-price"
             class="crypto-price loading">
            --
        </div>

        <div id="BNB-change"
             class="crypto-change loading">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            OKB
        </div>

        <div id="OKB-price"
             class="crypto-price loading">
            --
        </div>

        <div id="OKB-change"
             class="crypto-change loading">
            --
        </div>

    </div>

</div>


<!-- =========================
     底部
========================= -->

<div class="footer">

    <div id="market-status">
        美股收市 · 周末
    </div>

    <div>
        最后更新：
        <span id="updated">
            --
        </span>
    </div>

</div>


<script>

/* =========================================================
   核心设置
========================================================= */

/*
 * 非常重要：
 *
 * 这里不再使用 workers.dev。
 *
 * 页面直接读取 GitHub Pages 同目录下的：
 *
 * data.json
 *
 * 所以手机换网络也可以正常读取。
 */

const DATA_URL =
    "./data.json?timestamp=" +
    Date.now();


/* =========================================================
   工具函数
========================================================= */

function formatNumber(value, decimals = 2) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "--";
    }

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        }
    );
}


function formatCrypto(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "--";
    }

    if (number >= 1000) {

        return number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

    }

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


function changeClass(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "neutral";
    }

    if (number > 0) {
        return "up";
    }

    if (number < 0) {
        return "down";
    }

    return "neutral";
}


function changeText(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "--";
    }

    if (number > 0) {
        return "▲ +" + number.toFixed(2) + "%";
    }

    if (number < 0) {
        return "▼ " + number.toFixed(2) + "%";
    }

    return "— 0.00%";
}


/* =========================================================
   股票
========================================================= */

const STOCK_SYMBOLS = [
    "NVDA",
    "TSLA",
    "AAPL",
    "MSTR",
    "STRC"
];


function updateStocks(data) {

    const stocks = Array.isArray(data.stocks)
        ? data.stocks
        : [];

    STOCK_SYMBOLS.forEach(
        (symbol, index) => {

            const item =
                stocks.find(
                    stock =>
                        String(
                            stock.symbol || ""
                        ).toUpperCase() === symbol
                );

            const rows =
                document.querySelectorAll(
                    ".stock-row"
                );

            if (!rows[index]) {
                return;
            }

            const priceElement =
                rows[index].querySelector(
                    ".stock-price"
                );

            const changeElement =
                rows[index].querySelector(
                    ".stock-change"
                );


            if (!item) {

                priceElement.textContent =
                    "--";

                changeElement.textContent =
                    "--";

                priceElement.className =
                    "stock-price neutral";

                changeElement.className =
                    "stock-change neutral";

                return;
            }


            priceElement.textContent =
                "$" +
                formatNumber(item.price, 2);


            changeElement.textContent =
                changeText(item.change);


            priceElement.className =
                "stock-price " +
                changeClass(item.change);


            changeElement.className =
                "stock-change " +
                changeClass(item.change);

        }
    );
}


/* =========================================================
   指数
========================================================= */

function updateIndex(
    elementPrefix,
    item
) {

    const priceElement =
        document.getElementById(
            elementPrefix + "-price"
        );

    const changeElement =
        document.getElementById(
            elementPrefix + "-change"
        );


    if (!item) {

        priceElement.textContent =
            "--";

        changeElement.textContent =
            "--";

        return;
    }


    priceElement.textContent =
        formatNumber(item.price, 2);


    changeElement.textContent =
        changeText(item.change);


    priceElement.className =
        "index-price " +
        changeClass(item.change);


    changeElement.className =
        "index-change " +
        changeClass(item.change);
}


function updateIndexes(data) {

    const indexes =
        data.indices || {};


    updateIndex(
        "nasdaq",
        indexes.nasdaq
    );


    updateIndex(
        "sp500",
        indexes.sp500
    );
}


/* =========================================================
   加密货币
========================================================= */

const CRYPTO_SYMBOLS = [
    "BTC",
    "ETH",
    "BNB",
    "OKB"
];


function updateCrypto(data) {

    const crypto =
        Array.isArray(data.crypto)
            ? data.crypto
            : [];


    CRYPTO_SYMBOLS.forEach(
        symbol => {

            const item =
                crypto.find(
                    coin =>
                        String(
                            coin.symbol || ""
                        ).toUpperCase() === symbol
                );


            const priceElement =
                document.getElementById(
                    symbol + "-price"
                );

            const changeElement =
                document.getElementById(
                    symbol + "-change"
                );


            if (!item) {

                priceElement.textContent =
                    "--";

                changeElement.textContent =
                    "--";

                return;
            }


            priceElement.textContent =
                "$" +
                formatCrypto(item.price);


            changeElement.textContent =
                changeText(item.change);


            priceElement.className =
                "crypto-price " +
                changeClass(item.change);


            changeElement.className =
                "crypto-change " +
                changeClass(item.change);

        }
    );
}


/* =========================================================
   更新时间
========================================================= */

function updateTime(data) {

    const element =
        document.getElementById(
            "updated"
        );


    if (!data.updatedAt) {

        element.textContent =
            "--";

        return;
    }


    const date =
        new Date(data.updatedAt);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        element.textContent =
            "--";

        return;
    }


    element.textContent =
        date.toLocaleTimeString(
            "zh-CN",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );
}


/* =========================================================
   市场状态
========================================================= */

function updateMarketStatus() {

    const now =
        new Date();


    const day =
        now.getDay();


    /*
     * 这里仅用于显示提示。
     * 实际行情仍然完全由 data.json 决定。
     */

    const status =
        document.getElementById(
            "market-status"
        );


    if (
        day === 0 ||
        day === 6
    ) {

        status.textContent =
            "美股收市 · 周末";

    } else {

        status.textContent =
            "美股行情 · 自动更新";

    }
}


/* =========================================================
   获取数据
========================================================= */

async function loadData() {

    try {

        /*
         * cache: no-store
         *
         * 防止 Safari / iPhone
         * 长时间使用旧数据。
         */

        const response =
            await fetch(
                DATA_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "data.json HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data) {
            throw new Error(
                "data.json 为空"
            );
        }


        updateStocks(data);

        updateIndexes(data);

        updateCrypto(data);

        updateTime(data);

        updateMarketStatus();


        console.log(
            "行情数据更新成功",
            data
        );


    } catch (error) {

        console.error(
            "读取行情失败：",
            error
        );


        document.getElementById(
            "updated"
        ).textContent =
            "读取失败";


        /*
         * 不把整个网页弄成报错页面，
         * 保留之前已经显示的数据。
         */

    }

}


/* =========================================================
   时钟
========================================================= */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            "zh-CN",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );
}


/* =========================================================
   启动
========================================================= */

updateClock();

setInterval(
    updateClock,
    1000
);


loadData();


/*
 * 每 60 秒重新读取一次 data.json。
 *
 * 注意：
 * 这不是直接请求 Binance / OKX / CoinGecko。
 *
 * 手机只访问 GitHub Pages 自己的 data.json，
 * 所以不会再受到 workers.dev、
 * Binance 429、
 * OKX 429、
 * CoinGecko 429
 * 的影响。
 */

setInterval(
    loadData,
    60 * 1000
);

</script>

</body>
</html>
