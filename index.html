<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>美股行情</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050607;
    color: #f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    padding: 12px;
}

/* =========================
   页面顶部
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid #20242a;
    padding-bottom: 9px;
    margin-bottom: 0;
}

.title-box h1 {
    margin: 0;
    font-size: 25px;
    line-height: 1.2;
    font-weight: 700;
}

.subtitle {
    margin-top: 4px;
    font-size: 11px;
    color: #718096;
}

.clock {
    font-size: 13px;
    color: #9aa7b8;
    white-space: nowrap;
    padding-top: 4px;
}

/* =========================
   股票
========================= */

.stock-list {
    width: 100%;
}

.stock-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;

    min-height: 54px;

    border-bottom: 1px solid #20242a;
}

.stock-symbol {
    font-size: 20px;
    font-weight: 700;
    text-align: left;
}

.stock-price {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
}

.stock-change {
    font-size: 16px;
    font-weight: 700;
    text-align: right;
}

.up {
    color: #00d084;
}

.down {
    color: #ff4560;
}

.neutral {
    color: #9aa7b8;
}

/* =========================
   区域标题
========================= */

.section-title {
    margin-top: 10px;
    margin-bottom: 5px;

    font-size: 12px;
    color: #8b98a8;
    letter-spacing: 0.2px;
}

/* =========================
   指数
========================= */

.index-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.index-card {
    background: #0d1014;
    border-radius: 6px;
    padding: 7px 10px;
    min-height: 49px;
}

.index-name {
    font-size: 11px;
    color: #8d99a8;
    margin-bottom: 2px;
}

.index-value {
    font-size: 16px;
    font-weight: 700;
}

.index-change {
    font-size: 13px;
    font-weight: 700;
    margin-left: 4px;
}

/* =========================
   加密货币
========================= */

.crypto-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.crypto-card {
    background: #0d1014;
    border-radius: 6px;
    padding: 8px 10px;
    min-height: 67px;
}

.crypto-symbol {
    font-size: 13px;
    font-weight: 700;
}

.crypto-price {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 700;
}

.crypto-change {
    margin-top: 1px;
    font-size: 12px;
    font-weight: 700;
}

/* =========================
   底部状态
========================= */

.footer {
    text-align: center;
    margin-top: 9px;
    padding-bottom: 2px;
}

.market-status {
    font-size: 10px;
    color: #697586;
}

.updated {
    margin-top: 3px;
    font-size: 10px;
    color: #596474;
}

/* =========================
   加载状态
========================= */

.loading {
    color: #687384;
}

/* =========================
   手机适配
========================= */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .title-box h1 {
        font-size: 22px;
    }

    .clock {
        font-size: 11px;
    }

    .stock-row {
        min-height: 50px;
    }

    .stock-symbol {
        font-size: 18px;
    }

    .stock-price {
        font-size: 17px;
    }

    .stock-change {
        font-size: 14px;
    }

    .crypto-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .crypto-card {
        min-height: 64px;
    }
}

/* =========================
   iPhone 6 / 6 Plus
========================= */

@media (max-width: 414px) {

    body {
        padding: 7px;
    }

    .title-box h1 {
        font-size: 21px;
    }

    .stock-row {
        min-height: 48px;
    }

    .stock-symbol {
        font-size: 17px;
    }

    .stock-price {
        font-size: 16px;
    }

    .stock-change {
        font-size: 13px;
    }

    .index-card {
        padding: 6px 8px;
    }

    .index-value {
        font-size: 14px;
    }

    .crypto-card {
        padding: 7px 8px;
    }

    .crypto-price {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     顶部
========================= -->

<div class="header">

    <div class="title-box">
        <h1>美股行情</h1>

        <div class="subtitle">
            iPhone 6 Plus · 自动更新
        </div>
    </div>

    <div class="clock" id="clock">
        --:--:--
    </div>

</div>


<!-- =========================
     股票
========================= -->

<div class="stock-list" id="stocks">

    <div class="stock-row">
        <div class="stock-symbol">NVDA</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">TSLA</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">AAPL</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">MSTR</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

    <div class="stock-row">
        <div class="stock-symbol">STRC</div>
        <div class="stock-price loading">--</div>
        <div class="stock-change loading">--</div>
    </div>

</div>


<!-- =========================
     指数
========================= -->

<div class="section-title">
    MARKET INDEX
</div>

<div class="index-grid">

    <div class="index-card">

        <div class="index-name">
            NASDAQ
        </div>

        <div>
            <span
                class="index-value loading"
                id="nasdaq-price">
                --
            </span>

            <span
                class="index-change loading"
                id="nasdaq-change">
                --
            </span>
        </div>

    </div>


    <div class="index-card">

        <div class="index-name">
            S&P 500
        </div>

        <div>
            <span
                class="index-value loading"
                id="sp500-price">
                --
            </span>

            <span
                class="index-change loading"
                id="sp500-change">
                --
            </span>
        </div>

    </div>

</div>


<!-- =========================
     加密货币
========================= -->

<div class="section-title">
    CRYPTO · 加密货币
</div>

<div class="crypto-grid">

    <div class="crypto-card">

        <div class="crypto-symbol">
            BTC
        </div>

        <div
            class="crypto-price loading"
            id="BTC-price">
            --
        </div>

        <div
            class="crypto-change loading"
            id="BTC-change">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            ETH
        </div>

        <div
            class="crypto-price loading"
            id="ETH-price">
            --
        </div>

        <div
            class="crypto-change loading"
            id="ETH-change">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            BNB
        </div>

        <div
            class="crypto-price loading"
            id="BNB-price">
            --
        </div>

        <div
            class="crypto-change loading"
            id="BNB-change">
            --
        </div>

    </div>


    <div class="crypto-card">

        <div class="crypto-symbol">
            OKB
        </div>

        <div
            class="crypto-price loading"
            id="OKB-price">
            --
        </div>

        <div
            class="crypto-change loading"
            id="OKB-change">
            --
        </div>

    </div>

</div>


<!-- =========================
     底部
========================= -->

<div class="footer">

    <div
        class="market-status"
        id="market-status">
        正在获取市场状态...
    </div>

    <div
        class="updated"
        id="updated">
        最后更新：--
    </div>

</div>


<script>

/* =====================================================
   行情数据
===================================================== */

const stockSymbols = [
    "NVDA",
    "TSLA",
    "AAPL",
    "MSTR",
    "STRC"
];

const cryptoSymbols = [
    "BTC",
    "ETH",
    "BNB",
    "OKB"
];


/* =====================================================
   数字格式
===================================================== */

function formatNumber(value, digits = 2) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "--";
    }

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }
    );
}


/* =====================================================
   股票价格
===================================================== */

function formatStockPrice(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "--";
    }

    return "$" + formatNumber(value, 2);
}


/* =====================================================
   加密货币价格
===================================================== */

function formatCryptoPrice(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "--";
    }

    return "$" + formatNumber(value, 2);
}


/* =====================================================
   涨跌幅
===================================================== */

function formatChange(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return {
            text: "--",
            className: "neutral"
        };
    }

    const number = Number(value);

    if (number > 0) {

        return {
            text:
                "▲ +" +
                number.toFixed(2) +
                "%",
            className: "up"
        };

    }

    if (number < 0) {

        return {
            text:
                "▼ " +
                number.toFixed(2) +
                "%",
            className: "down"
        };

    }

    return {
        text: "— 0.00%",
        className: "neutral"
    };
}


/* =====================================================
   更新股票
===================================================== */

function renderStocks(data) {

    const container =
        document.getElementById("stocks");

    container.innerHTML = "";

    for (const symbol of stockSymbols) {

        const item =
            data.stocks.find(
                stock =>
                    stock.symbol === symbol
            );

        const row =
            document.createElement("div");

        row.className =
            "stock-row";

        const change =
            formatChange(
                item ? item.change : null
            );

        row.innerHTML = `

            <div class="stock-symbol">
                ${symbol}
            </div>

            <div class="stock-price">
                ${
                    item
                    ? formatStockPrice(item.price)
                    : "--"
                }
            </div>

            <div class="stock-change ${change.className}">
                ${change.text}
            </div>

        `;

        container.appendChild(row);
    }
}


/* =====================================================
   更新指数
===================================================== */

function renderIndex(
    data,
    key,
    priceId,
    changeId
) {

    const item =
        data.indices &&
        data.indices[key];

    const priceElement =
        document.getElementById(
            priceId
        );

    const changeElement =
        document.getElementById(
            changeId
        );

    if (!item) {

        priceElement.textContent =
            "--";

        changeElement.textContent =
            "--";

        return;
    }

    priceElement.textContent =
        formatNumber(
            item.price,
            2
        );

    const change =
        formatChange(
            item.change
        );

    changeElement.textContent =
        change.text;

    changeElement.className =
        "index-change " +
        change.className;
}


/* =====================================================
   更新加密货币
===================================================== */

function renderCrypto(data) {

    for (
        const symbol of cryptoSymbols
    ) {

        const item =
            data.crypto.find(
                crypto =>
                    crypto.symbol === symbol
            );

        const priceElement =
            document.getElementById(
                symbol + "-price"
            );

        const changeElement =
            document.getElementById(
                symbol + "-change"
            );

        if (!item) {

            priceElement.textContent =
                "--";

            changeElement.textContent =
                "--";

            continue;
        }

        priceElement.textContent =
            formatCryptoPrice(
                item.price
            );

        const change =
            formatChange(
                item.change
            );

        changeElement.textContent =
            change.text;

        changeElement.className =
            "crypto-change " +
            change.className;
    }
}


/* =====================================================
   更新时间
===================================================== */

function renderUpdatedTime(
    isoTime
) {

    if (!isoTime) {

        document.getElementById(
            "updated"
        ).textContent =
            "最后更新：--";

        return;
    }

    const date =
        new Date(isoTime);

    const formatter =
        new Intl.DateTimeFormat(
            "zh-CN",
            {
                timeZone:
                    "Asia/Shanghai",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: false
            }
        );

    document.getElementById(
        "updated"
    ).textContent =
        "最后更新：" +
        formatter.format(date);
}


/* =====================================================
   市场状态
===================================================== */

function renderMarketStatus(
    status
) {

    const element =
        document.getElementById(
            "market-status"
        );

    if (!status) {

        element.textContent =
            "市场状态：--";

        return;
    }

    element.textContent =
        status;
}


/* =====================================================
   获取 data.json
===================================================== */

async function loadMarketData() {

    try {

        const response =
            await fetch(
                "./data.json?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (
            !data ||
            data.success !== true
        ) {

            throw new Error(
                "行情数据无效"
            );
        }

        renderStocks(data);

        renderIndex(
            data,
            "nasdaq",
            "nasdaq-price",
            "nasdaq-change"
        );

        renderIndex(
            data,
            "sp500",
            "sp500-price",
            "sp500-change"
        );

        renderCrypto(data);

        renderMarketStatus(
            data.marketStatus
        );

        renderUpdatedTime(
            data.updatedAt
        );

    } catch (error) {

        console.error(
            "行情读取失败:",
            error
        );

        document.getElementById(
            "market-status"
        ).textContent =
            "行情数据读取失败";

    }
}


/* =====================================================
   实时北京时间
===================================================== */

function updateClock() {

    const now =
        new Date();

    const formatter =
        new Intl.DateTimeFormat(
            "zh-CN",
            {
                timeZone:
                    "Asia/Shanghai",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: false
            }
        );

    document.getElementById(
        "clock"
    ).textContent =
        formatter.format(now);
}


/* =====================================================
   启动
===================================================== */

updateClock();

loadMarketData();


/* 每秒更新时间 */

setInterval(
    updateClock,
    1000
);


/*
 * 每 60 秒重新读取一次 data.json。
 *
 * 注意：
 * 后端本身每 5 分钟更新一次，
 * 所以前端刷新不会凭空产生新的行情，
 * 只是及时读取后端最新的数据。
 */

setInterval(
    loadMarketData,
    60 * 1000
);

</script>

</body>
</html>
