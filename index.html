<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>股票行情</title>

<style>
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#050608;
    color:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

*{
    box-sizing:border-box;
}

#app{
    width:100%;
    min-height:100vh;
    padding:10px 14px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid #252a31;
    padding-bottom:8px;
    margin-bottom:4px;
}

.title{
    font-size:22px;
    font-weight:700;
}

.sub{
    margin-top:3px;
    font-size:11px;
    color:#7f8996;
}

.clock{
    font-size:12px;
    color:#aab2bd;
    white-space:nowrap;
}

.stock{
    display:flex;
    align-items:center;
    height:49px;
    border-bottom:1px solid #20242a;
}

.stock-symbol{
    width:22%;
    font-size:18px;
    font-weight:700;
}

.stock-price{
    width:40%;
    text-align:right;
    padding-right:12px;
    font-size:17px;
    font-weight:700;
}

.stock-change{
    width:38%;
    text-align:right;
    font-size:16px;
    font-weight:700;
}

.up{
    color:#22c77a;
}

.down{
    color:#ff5964;
}

.flat{
    color:#aab2bd;
}

.index-box{
    display:flex;
    gap:10px;
    padding:9px 0 6px;
}

.index{
    flex:1;
    background:#0d1015;
    border-radius:6px;
    padding:6px 8px;
}

.index-name{
    font-size:11px;
    color:#89929e;
}

.index-value{
    margin-top:2px;
    font-size:14px;
    font-weight:700;
}

.crypto-title{
    margin-top:2px;
    margin-bottom:6px;
    font-size:12px;
    color:#89929e;
}

.crypto-box{
    display:flex;
    gap:8px;
}

.crypto{
    flex:1;
    min-width:0;
    background:#0d1015;
    border-radius:6px;
    padding:7px 8px;
}

.crypto-symbol{
    font-size:12px;
    font-weight:700;
}

.crypto-price{
    margin-top:2px;
    font-size:14px;
    font-weight:700;
}

.crypto-change{
    margin-top:2px;
    font-size:12px;
    font-weight:700;
}

.status{
    text-align:center;
    font-size:9px;
    color:#68717d;
    margin-top:8px;
    line-height:1.5;
}

.error{
    color:#ff5964;
    text-align:center;
    font-size:11px;
    margin-top:10px;
}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        <div>
            <div class="title">美股行情</div>
            <div class="sub">iPhone 6 Plus · 自动更新</div>
        </div>

        <div id="clock" class="clock">--:--:--</div>
    </div>

    <div id="stocks"></div>

    <div class="index-box">
        <div class="index">
            <div class="index-name">NASDAQ</div>
            <div id="nasdaq" class="index-value">--</div>
        </div>

        <div class="index">
            <div class="index-name">S&P 500</div>
            <div id="sp500" class="index-value">--</div>
        </div>
    </div>

    <div class="crypto-title">CRYPTO · 加密货币</div>

    <div id="crypto" class="crypto-box"></div>

    <div id="status" class="status">
        正在获取行情...
    </div>

    <div id="error" class="error"></div>

</div>

<script>

var API_URL = "https://stock-board-api.1309475064.workers.dev/";

var stockOrder = [
    "NVDA",
    "TSLA",
    "AAPL",
    "MSTR",
    "STRC"
];

var cryptoOrder = [
    "BTC",
    "ETH",
    "BNB",
    "OKB"
];

function formatNumber(value, digits){
    if(value === null || value === undefined || isNaN(value)){
        return "--";
    }

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }
    );
}

function formatPrice(value){
    if(value === null || value === undefined || isNaN(value)){
        return "--";
    }

    var n = Number(value);

    if(n >= 1000){
        return "$" + n.toLocaleString("en-US",{
            minimumFractionDigits:0,
            maximumFractionDigits:2
        });
    }

    return "$" + n.toFixed(2);
}

function changeClass(value){
    if(Number(value) > 0){
        return "up";
    }

    if(Number(value) < 0){
        return "down";
    }

    return "flat";
}

function changeText(value){
    var n = Number(value);

    if(isNaN(n)){
        return "--";
    }

    if(n > 0){
        return "▲ +" + n.toFixed(2) + "%";
    }

    if(n < 0){
        return "▼ " + n.toFixed(2) + "%";
    }

    return "— 0.00%";
}

function updateClock(){

    var now = new Date();

    var h = String(now.getHours()).padStart(2,"0");
    var m = String(now.getMinutes()).padStart(2,"0");
    var s = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").textContent =
        h + ":" + m + ":" + s;
}

function renderStocks(data){

    var html = "";

    for(var i = 0; i < stockOrder.length; i++){

        var symbol = stockOrder[i];
        var item = null;

        for(var j = 0; j < data.stocks.length; j++){

            if(data.stocks[j].symbol === symbol){
                item = data.stocks[j];
                break;
            }

        }

        if(!item){
            continue;
        }

        html +=
            '<div class="stock">' +

                '<div class="stock-symbol">' +
                    symbol +
                '</div>' +

                '<div class="stock-price">' +
                    formatPrice(item.price) +
                '</div>' +

                '<div class="stock-change ' +
                    changeClass(item.change) +
                '">' +
                    changeText(item.change) +
                '</div>' +

            '</div>';
    }

    document.getElementById("stocks").innerHTML = html;
}

function renderIndices(data){

    if(data.indices && data.indices.nasdaq){

        var n = data.indices.nasdaq;

        document.getElementById("nasdaq").innerHTML =
            formatNumber(n.price,2) +
            ' <span class="' +
            changeClass(n.change) +
            '">' +
            changeText(n.change) +
            '</span>';
    }

    if(data.indices && data.indices.sp500){

        var s = data.indices.sp500;

        document.getElementById("sp500").innerHTML =
            formatNumber(s.price,2) +
            ' <span class="' +
            changeClass(s.change) +
            '">' +
            changeText(s.change) +
            '</span>';
    }
}

function renderCrypto(data){

    var html = "";

    if(!data.crypto){
        return;
    }

    for(var i = 0; i < cryptoOrder.length; i++){

        var symbol = cryptoOrder[i];
        var item = null;

        for(var j = 0; j < data.crypto.length; j++){

            if(data.crypto[j].symbol === symbol){
                item = data.crypto[j];
                break;
            }

        }

        if(!item){
            continue;
        }

        html +=
            '<div class="crypto">' +

                '<div class="crypto-symbol">' +
                    symbol +
                '</div>' +

                '<div class="crypto-price">' +
                    formatPrice(item.price) +
                '</div>' +

                '<div class="crypto-change ' +
                    changeClass(item.change) +
                '">' +
                    changeText(item.change) +
                '</div>' +

            '</div>';
    }

    document.getElementById("crypto").innerHTML = html;
}

function loadData(){

    document.getElementById("error").textContent = "";

    fetch(API_URL + "?t=" + Date.now(), {
        cache:"no-store"
    })

    .then(function(response){

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        return response.json();

    })

    .then(function(data){

        if(!data.success){
            throw new Error(data.error || "API返回失败");
        }

        renderStocks(data);
        renderIndices(data);
        renderCrypto(data);

        var time = new Date();

        document.getElementById("status").textContent =
            "最后更新：" +
            time.getHours().toString().padStart(2,"0") +
            ":" +
            time.getMinutes().toString().padStart(2,"0") +
            ":" +
            time.getSeconds().toString().padStart(2,"0");

    })

    .catch(function(error){

        console.log(error);

        document.getElementById("error").textContent =
            "行情获取失败：" + error.message;

    });
}

updateClock();

setInterval(updateClock,1000);

loadData();

/* 每60秒自动更新 */
setInterval(loadData,60000);

</script>

</body>
</html>
