<!doctype html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>美股行情</title>

<style>

html,
body{

    margin:0;

    padding:0;

    width:100%;

    min-height:100%;

    background:#050608;

    color:#f4f6f8;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

}

*{

    box-sizing:border-box;

}

body{

    overflow-x:hidden;

}

#app{

    width:100%;

    min-height:100vh;

    padding:
        10px
        12px
        8px;

}


/* =========================
   顶部
========================= */

.header{

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    border-bottom:
        1px solid #252a31;

    padding-bottom:8px;

    margin-bottom:3px;

}

.title{

    font-size:22px;

    line-height:1;

    font-weight:800;

    letter-spacing:.3px;

}

.sub{

    margin-top:4px;

    font-size:10px;

    color:#7f8996;

}

.clock{

    font-size:12px;

    color:#aab2bd;

    white-space:nowrap;

}


/* =========================
   市场状态
========================= */

.market-status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        6px
        2px
        5px;

    border-bottom:
        1px solid #20242a;

    font-size:10px;

}

.market-left{

    color:#89929e;

}

.market-right{

    font-weight:700;

}

.market-open{

    color:#22c77a;

}

.market-pre{

    color:#f2c94c;

}

.market-after{

    color:#7aa7ff;

}

.market-close{

    color:#89929e;

}


/* =========================
   股票
========================= */

.stock{

    display:flex;

    align-items:center;

    min-height:47px;

    border-bottom:
        1px solid #20242a;

}

.stock-symbol{

    width:22%;

    font-size:17px;

    font-weight:800;

}

.stock-price{

    width:40%;

    text-align:right;

    padding-right:12px;

    font-size:17px;

    font-weight:800;

}

.stock-change{

    width:38%;

    text-align:right;

    font-size:15px;

    font-weight:800;

}


/* =========================
   涨跌
========================= */

.up{

    color:#22c77a;

}

.down{

    color:#ff5964;

}

.flat{

    color:#aab2bd;

}


/* =========================
   指数
========================= */

.index-box{

    display:flex;

    gap:8px;

    padding:
        7px
        0
        6px;

}

.index{

    flex:1;

    background:#0d1015;

    border-radius:6px;

    padding:
        6px
        8px;

}

.index-name{

    font-size:10px;

    color:#89929e;

}

.index-value{

    margin-top:2px;

    font-size:13px;

    font-weight:800;

}


/* =========================
   加密货币
========================= */

.crypto-title{

    margin-top:1px;

    margin-bottom:5px;

    font-size:11px;

    color:#89929e;

}

.crypto-box{

    display:flex;

    gap:7px;

}

.crypto{

    flex:1;

    min-width:0;

    background:#0d1015;

    border-radius:6px;

    padding:
        6px
        7px;

}

.crypto-symbol{

    font-size:11px;

    font-weight:800;

}

.crypto-price{

    margin-top:2px;

    font-size:13px;

    font-weight:800;

}

.crypto-change{

    margin-top:2px;

    font-size:10px;

    font-weight:800;

}


/* =========================
   底部
========================= */

.status{

    text-align:center;

    font-size:9px;

    color:#68717d;

    margin-top:7px;

    line-height:1.4;

}

.error{

    text-align:center;

    font-size:10px;

    color:#ff5964;

    margin-top:6px;

}


/* =========================
   iPhone 6 Plus
========================= */

@media
(max-width:500px){

    #app{

        padding:
            9px
            10px
            7px;

    }

    .title{

        font-size:21px;

    }

    .stock{

        min-height:48px;

    }

    .stock-symbol{

        font-size:16px;

    }

    .stock-price{

        font-size:16px;

        padding-right:8px;

    }

    .stock-change{

        font-size:14px;

    }

    .index{

        padding:
            6px
            7px;

    }

    .crypto{

        padding:
            6px;

    }

}


/* =========================
   很小屏幕
========================= */

@media
(max-width:360px){

    .stock-symbol{

        font-size:15px;

    }

    .stock-price{

        font-size:15px;

    }

    .stock-change{

        font-size:13px;

    }

    .crypto-price{

        font-size:12px;

    }

}

</style>

</head>


<body>

<div id="app">


    <!-- 顶部 -->

    <div class="header">

        <div>

            <div class="title">
                美股行情
            </div>

            <div class="sub">
                iPhone 6 Plus · 自动更新
            </div>

        </div>


        <div
            id="clock"
            class="clock">
            --:--:--
        </div>

    </div>


    <!-- 市场状态 -->

    <div class="market-status">

        <div class="market-left">
            美股市场
        </div>

        <div
            id="marketStatus"
            class="market-right market-close">
            判断中...
        </div>

    </div>


    <!-- 股票 -->

    <div id="stocks"></div>


    <!-- 指数 -->

    <div class="index-box">

        <div class="index">

            <div class="index-name">
                NASDAQ
            </div>

            <div
                id="nasdaq"
                class="index-value">
                --
            </div>

        </div>


        <div class="index">

            <div class="index-name">
                S&P 500
            </div>

            <div
                id="sp500"
                class="index-value">
                --
            </div>

        </div>

    </div>


    <!-- 加密货币 -->

    <div class="crypto-title">

        CRYPTO · 加密货币

    </div>


    <div
        id="crypto"
        class="crypto-box">
    </div>


    <!-- 更新时间 -->

    <div
        id="status"
        class="status">

        正在获取行情...

    </div>


    <div
        id="error"
        class="error">
    </div>


</div>


<script>


/* =========================
   API
========================= */

var API_URL =
"https://stock-board-api.1309475064.workers.dev/";


/* =========================
   股票顺序
========================= */

var stockOrder = [

    "NVDA",

    "TSLA",

    "AAPL",

    "MSTR",

    "STRC"

];


/* =========================
   加密货币顺序
========================= */

var cryptoOrder = [

    "BTC",

    "ETH",

    "BNB",

    "OKB"

];


/* =========================
   数字格式
========================= */

function formatNumber(
    value,
    digits
){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }


    return Number(value)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits:digits,
                maximumFractionDigits:digits
            }
        );

}


/* =========================
   价格格式
========================= */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }


    var n =
        Number(value);


    if(n >= 1000){

        return "$" +
            n.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:0,
                    maximumFractionDigits:2
                }
            );

    }


    return "$" +
        n.toFixed(2);

}


/* =========================
   涨跌颜色
========================= */

function changeClass(value){

    if(Number(value) > 0){

        return "up";

    }


    if(Number(value) < 0){

        return "down";

    }


    return "flat";

}


/* =========================
   涨跌文字
========================= */

function changeText(value){

    var n =
        Number(value);


    if(isNaN(n)){

        return "--";

    }


    if(n > 0){

        return "▲ +" +
            n.toFixed(2) +
            "%";

    }


    if(n < 0){

        return "▼ " +
            n.toFixed(2) +
            "%";

    }


    return "— 0.00%";

}


/* =========================
   时钟
========================= */

function updateClock(){

    var now =
        new Date();


    var h =
        String(
            now.getHours()
        ).padStart(2,"0");


    var m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    var s =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document
        .getElementById("clock")
        .textContent =
            h + ":" +
            m + ":" +
            s;

}


/* =========================
   美股市场状态
========================= */

function updateMarketStatus(){

    var now =
        new Date();


    /*
       使用美国东部时间
    */

    var parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:"America/New_York",
                weekday:"short",
                hour:"numeric",
                minute:"numeric",
                hour12:false
            }
        ).formatToParts(now);


    var weekday = "";

    var hour = 0;

    var minute = 0;


    for(
        var i=0;
        i<parts.length;
        i++
    ){

        if(
            parts[i].type === "weekday"
        ){

            weekday =
                parts[i].value;

        }


        if(
            parts[i].type === "hour"
        ){

            hour =
                Number(parts[i].value);

        }


        if(
            parts[i].type === "minute"
        ){

            minute =
                Number(parts[i].value);

        }

    }


    var total =
        hour * 60 +
        minute;


    var status =
        document
        .getElementById(
            "marketStatus"
        );


    status.className =
        "market-right";


    /*
       周末
    */

    if(
        weekday === "Sat" ||
        weekday === "Sun"
    ){

        status.textContent =
            "休市";

        status.classList
            .add("market-close");

        return;

    }


    /*
       美股正式交易：
       09:30 - 16:00
    */

    if(
        total >= 570 &&
        total < 960
    ){

        status.textContent =
            "● 交易中";

        status.classList
            .add("market-open");

        return;

    }


    /*
       盘前：
       04:00 - 09:30
    */

    if(
        total >= 240 &&
        total < 570
    ){

        status.textContent =
            "盘前";

        status.classList
            .add("market-pre");

        return;

    }


    /*
       盘后：
       16:00 - 20:00
    */

    if(
        total >= 960 &&
        total < 1200
    ){

        status.textContent =
            "盘后";

        status.classList
            .add("market-after");

        return;

    }


    /*
       其他时间
    */

    status.textContent =
        "休市";

    status.classList
        .add("market-close");

}


/* =========================
   股票渲染
========================= */

function renderStocks(data){

    var html = "";


    for(
        var i=0;
        i<stockOrder.length;
        i++
    ){

        var symbol =
            stockOrder[i];


        var item = null;


        for(
            var j=0;
            j<data.stocks.length;
            j++
        ){

            if(
                data.stocks[j].symbol ===
                symbol
            ){

                item =
                    data.stocks[j];

                break;

            }

        }


        if(!item){

            continue;

        }


        html +=

            '<div class="stock">' +

                '<div class="stock-symbol">' +
                    symbol +
                '</div>' +

                '<div class="stock-price">' +
                    formatPrice(
                        item.price
                    ) +
                '</div>' +

                '<div class="stock-change ' +
                    changeClass(
                        item.change
                    ) +
                '">' +

                    changeText(
                        item.change
                    ) +

                '</div>' +

            '</div>';

    }


    document
        .getElementById("stocks")
        .innerHTML =
            html;

}


/* =========================
   指数
========================= */

function renderIndices(data){

    if(
        data.indices &&
        data.indices.nasdaq
    ){

        var n =
            data.indices.nasdaq;


        document
            .getElementById("nasdaq")
            .innerHTML =

                formatNumber(
                    n.price,
                    2
                ) +

                ' <span class="' +
                changeClass(n.change) +
                '">' +

                changeText(n.change) +

                '</span>';

    }


    if(
        data.indices &&
        data.indices.sp500
    ){

        var s =
            data.indices.sp500;


        document
            .getElementById("sp500")
            .innerHTML =

                formatNumber(
                    s.price,
                    2
                ) +

                ' <span class="' +
                changeClass(s.change) +
                '">' +

                changeText(s.change) +

                '</span>';

    }

}


/* =========================
   加密货币
========================= */

function renderCrypto(data){

    var html = "";


    if(!data.crypto){

        return;

    }


    for(
        var i=0;
        i<cryptoOrder.length;
        i++
    ){

        var symbol =
            cryptoOrder[i];


        var item = null;


        for(
            var j=0;
            j<data.crypto.length;
            j++
        ){

            if(
                data.crypto[j].symbol ===
                symbol
            ){

                item =
                    data.crypto[j];

                break;

            }

        }


        if(!item){

            continue;

        }


        html +=

            '<div class="crypto">' +

                '<div class="crypto-symbol">' +
                    symbol +
                '</div>' +

                '<div class="crypto-price">' +
                    formatPrice(
                        item.price
                    ) +
                '</div>' +

                '<div class="crypto-change ' +
                    changeClass(
                        item.change
                    ) +
                '">' +

                    changeText(
                        item.change
                    ) +

                '</div>' +

            '</div>';

    }


    document
        .getElementById("crypto")
        .innerHTML =
            html;

}


/* =========================
   获取数据
========================= */

function loadData(){

    document
        .getElementById("error")
        .textContent = "";


    fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
            cache:"no-store"
        }
    )

    .then(
        function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            return response.json();

        }
    )

    .then(
        function(data){

            if(!data.success){

                throw new Error(
                    data.error ||
                    "API返回失败"
                );

            }


            renderStocks(data);

            renderIndices(data);

            renderCrypto(data);


            var now =
                new Date();


            document
                .getElementById("status")
                .textContent =

                    "最后更新：" +

                    String(
                        now.getHours()
                    ).padStart(2,"0") +

                    ":" +

                    String(
                        now.getMinutes()
                    ).padStart(2,"0") +

                    ":" +

                    String(
                        now.getSeconds()
                    ).padStart(2,"0");

        }
    )

    .catch(
        function(error){

            console.log(error);


            document
                .getElementById("error")
                .textContent =

                    "行情获取失败：" +
                    error.message;

        }
    );

}


/* =========================
   启动
========================= */

updateClock();

updateMarketStatus();

loadData();


/* 每秒更新时钟 */

setInterval(
    updateClock,
    1000
);


/* 每分钟更新行情 */

setInterval(
    loadData,
    60000
);


/* 每分钟检查市场状态 */

setInterval(
    updateMarketStatus,
    60000
);


</script>

</body>
</html>
