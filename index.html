<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>美股行情</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050608;
    color:#f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

#app{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:14px;
}

/* =========================
   顶部
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding-bottom:10px;
    margin-bottom:5px;

    border-bottom:1px solid #20242a;
}

.title{
    font-size:24px;
    font-weight:800;
}

.subtitle{
    margin-top:3px;
    font-size:11px;
    color:#78818c;
}

.clock{
    font-size:12px;
    color:#9ca5af;
}

/* =========================
   股票
========================= */

.stock-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;

    align-items:center;

    min-height:54px;

    border-bottom:1px solid #20242a;
}

.stock-symbol{
    font-size:19px;
    font-weight:800;
}

.stock-price{
    text-align:center;

    font-size:18px;
    font-weight:750;

    font-variant-numeric:tabular-nums;
}

.stock-change{
    text-align:right;

    font-size:16px;
    font-weight:750;

    font-variant-numeric:tabular-nums;
}

/* =========================
   涨跌颜色
========================= */

.up{
    color:#19d889;
}

.down{
    color:#ff4d63;
}

.flat{
    color:#9aa3ad;
}

/* =========================
   区块标题
========================= */

.section-title{
    margin-top:12px;
    margin-bottom:6px;

    font-size:12px;
    color:#89939e;
}

/* =========================
   指数
========================= */

.index-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.index-card{
    background:#0c0f13;
    border-radius:7px;

    padding:8px 10px;

    min-height:48px;
}

.index-name{
    font-size:11px;
    color:#8d97a2;
}

.index-value{
    margin-top:3px;

    font-size:15px;
    font-weight:750;
}

/* =========================
   加密货币
========================= */

.crypto-grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.crypto-card{
    background:#0c0f13;
    border-radius:7px;

    padding:9px;

    min-height:65px;
}

.crypto-symbol{
    font-size:13px;
    font-weight:800;
}

.crypto-price{
    margin-top:3px;

    font-size:15px;
    font-weight:750;

    font-variant-numeric:tabular-nums;
}

.crypto-change{
    margin-top:2px;

    font-size:11px;
    font-weight:700;
}

/* =========================
   行情走势
========================= */

.chart-box{
    margin-top:16px;

    background:#090c10;

    border:1px solid #202630;
    border-radius:10px;

    padding:12px;
}

.chart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;
}

.chart-title{
    font-size:15px;
    color:#b9c3ce;
}

.history-count{
    font-size:10px;
    color:#697582;
}

.chart-buttons{
    display:flex;
    gap:6px;

    margin-bottom:12px;
}

.chart-button{
    border:0;
    border-radius:6px;

    background:#111720;
    color:#9aa7b5;

    padding:7px 12px;

    font-size:11px;
}

.chart-button.active{
    background:#27496f;
    color:white;
}

.chart-item{
    margin-top:10px;
    padding-top:10px;

    border-top:1px solid #20242a;
}

.chart-symbol{
    font-size:14px;
    font-weight:800;

    margin-bottom:4px;
}

.chart-svg{
    width:100%;
    height:120px;

    display:block;
}

/* =========================
   底部
========================= */

.footer{
    margin-top:12px;

    text-align:center;

    font-size:10px;
    line-height:1.6;

    color:#58616b;
}

/* =========================
   手机
========================= */

@media(max-width:600px){

    #app{
        padding:9px;
    }

    .title{
        font-size:21px;
    }

    .stock-row{
        min-height:49px;
    }

    .stock-symbol{
        font-size:17px;
    }

    .stock-price{
        font-size:16px;
    }

    .stock-change{
        font-size:14px;
    }

    .crypto-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:6px;
    }

    .crypto-card{
        min-height:58px;
        padding:8px;
    }

    .crypto-price{
        font-size:14px;
    }

    .chart-box{
        padding:9px;
    }

}

/* =========================
   iPhone 6 Plus
========================= */

@media(max-width:414px){

    #app{
        padding:8px;
    }

    .title{
        font-size:20px;
    }

    .stock-row{
        min-height:47px;
    }

    .stock-symbol{
        font-size:17px;
    }

    .stock-price{
        font-size:16px;
    }

    .stock-change{
        font-size:14px;
    }

    .chart-svg{
        height:105px;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- =====================
         顶部
    ====================== -->

    <div class="header">

        <div>

            <div class="title">
                美股行情
            </div>

            <div class="subtitle">
                iPhone 6 Plus · 自动更新
            </div>

        </div>

        <div id="clock"
             class="clock">
            --:--:--
        </div>

    </div>


    <!-- =====================
         美股
    ====================== -->

    <div id="stocks">

        <div class="stock-row">
            <div class="stock-symbol">NVDA</div>
            <div class="stock-price">--</div>
            <div class="stock-change">--</div>
        </div>

        <div class="stock-row">
            <div class="stock-symbol">TSLA</div>
            <div class="stock-price">--</div>
            <div class="stock-change">--</div>
        </div>

        <div class="stock-row">
            <div class="stock-symbol">AAPL</div>
            <div class="stock-price">--</div>
            <div class="stock-change">--</div>
        </div>

        <div class="stock-row">
            <div class="stock-symbol">MSTR</div>
            <div class="stock-price">--</div>
            <div class="stock-change">--</div>
        </div>

        <div class="stock-row">
            <div class="stock-symbol">STRC</div>
            <div class="stock-price">--</div>
            <div class="stock-change">--</div>
        </div>

    </div>


    <!-- =====================
         指数
    ====================== -->

    <div class="section-title">
        MARKET INDEX
    </div>

    <div class="index-grid">

        <div class="index-card">

            <div class="index-name">
                NASDAQ
            </div>

            <div id="nasdaq"
                 class="index-value">
                --
            </div>

        </div>


        <div class="index-card">

            <div class="index-name">
                S&P 500
            </div>

            <div id="sp500"
                 class="index-value">
                --
            </div>

        </div>

    </div>


    <!-- =====================
         加密货币
    ====================== -->

    <div class="section-title">
        CRYPTO · 加密货币
    </div>

    <div id="crypto"
         class="crypto-grid">

        <div class="crypto-card">

            <div class="crypto-symbol">
                BTC
            </div>

            <div class="crypto-price">
                --
            </div>

            <div class="crypto-change">
                --
            </div>

        </div>


        <div class="crypto-card">

            <div class="crypto-symbol">
                ETH
            </div>

            <div class="crypto-price">
                --
            </div>

            <div class="crypto-change">
                --
            </div>

        </div>


        <div class="crypto-card">

            <div class="crypto-symbol">
                BNB
            </div>

            <div class="crypto-price">
                --
            </div>

            <div class="crypto-change">
                --
            </div>

        </div>


        <div class="crypto-card">

            <div class="crypto-symbol">
                OKB
            </div>

            <div class="crypto-price">
                --
            </div>

            <div class="crypto-change">
                --
            </div>

        </div>

    </div>


    <!-- =====================
         行情走势
    ====================== -->

    <div class="chart-box">

        <div class="chart-header">

            <div class="chart-title">
                行情走势
            </div>

            <div id="historyCount"
                 class="history-count">
                0 次记录
            </div>

        </div>


        <div class="chart-buttons">

            <button class="chart-button active"
                    data-count="20">
                20次
            </button>

            <button class="chart-button"
                    data-count="60">
                60次
            </button>

            <button class="chart-button"
                    data-count="120">
                120次
            </button>

        </div>


        <div id="charts"></div>

    </div>


    <!-- =====================
         底部
    ====================== -->

    <div class="footer">

        <div id="marketStatus">
            行情更新中
        </div>

        <div>
            最后更新：
            <span id="updated">
                --
            </span>
        </div>

    </div>

</div>


<script>

/* ==================================================
   直接读取 GitHub Pages 自己的 data.json
   不再使用 Cloudflare Worker
================================================== */

var DATA_URL =
    "./data.json";


/* ==================================================
   工具
================================================== */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){
        return "--";
    }

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){
        return "--";
    }

    var n = Number(value);

    if(n > 0){
        return "▲ +" + n.toFixed(2) + "%";
    }

    if(n < 0){
        return "▼ " + n.toFixed(2) + "%";
    }

    return "— 0.00%";

}


function changeClass(value){

    if(Number(value) > 0){
        return "up";
    }

    if(Number(value) < 0){
        return "down";
    }

    return "flat";

}


/* ==================================================
   时钟
================================================== */

function updateClock(){

    var now = new Date();

    var h =
        String(now.getHours())
        .padStart(2,"0");

    var m =
        String(now.getMinutes())
        .padStart(2,"0");

    var s =
        String(now.getSeconds())
        .padStart(2,"0");

    document.getElementById(
        "clock"
    ).textContent =
        h + ":" + m + ":" + s;

}

setInterval(updateClock,1000);

updateClock();


/* ==================================================
   更新股票
================================================== */

function updateStocks(data){

    var map = {};

    if(
        data.stocks &&
        Array.isArray(data.stocks)
    ){

        data.stocks.forEach(function(item){

            map[item.symbol] = item;

        });

    }


    var rows =
        document.querySelectorAll(
            ".stock-row"
        );


    rows.forEach(function(row){

        var symbol =
            row.querySelector(
                ".stock-symbol"
            ).textContent.trim();

        var price =
            row.querySelector(
                ".stock-price"
            );

        var change =
            row.querySelector(
                ".stock-change"
            );


        var item = map[symbol];

        if(!item){
            return;
        }


        price.textContent =
            "$" +
            formatPrice(item.price);


        change.textContent =
            formatPercent(item.change);


        change.className =
            "stock-change " +
            changeClass(item.change);

    });

}


/* ==================================================
   更新指数
================================================== */

function updateIndices(data){

    if(
        data.indices &&
        data.indices.nasdaq
    ){

        var n =
            data.indices.nasdaq;

        document.getElementById(
            "nasdaq"
        ).innerHTML =
            formatPrice(n.price) +
            " " +
            '<span class="' +
            changeClass(n.change) +
            '">' +
            formatPercent(n.change) +
            "</span>";

    }


    if(
        data.indices &&
        data.indices.sp500
    ){

        var s =
            data.indices.sp500;

        document.getElementById(
            "sp500"
        ).innerHTML =
            formatPrice(s.price) +
            " " +
            '<span class="' +
            changeClass(s.change) +
            '">' +
            formatPercent(s.change) +
            "</span>";

    }

}


/* ==================================================
   更新加密货币
================================================== */

function updateCrypto(data){

    if(
        !data.crypto ||
        !Array.isArray(data.crypto)
    ){
        return;
    }


    var map = {};


    data.crypto.forEach(function(item){

        map[item.symbol] = item;

    });


    var cards =
        document.querySelectorAll(
            ".crypto-card"
        );


    cards.forEach(function(card){

        var symbol =
            card.querySelector(
                ".crypto-symbol"
            ).textContent.trim();


        var item =
            map[symbol];


        if(!item){
            return;
        }


        var price =
            card.querySelector(
                ".crypto-price"
            );

        var change =
            card.querySelector(
                ".crypto-change"
            );


        price.textContent =
            "$" +
            formatPrice(item.price);


        change.textContent =
            formatPercent(item.change);


        change.className =
            "crypto-change " +
            changeClass(item.change);

    });

}


/* ==================================================
   SVG 走势图
================================================== */

function makeChart(symbol, history){

    var values = [];


    history.forEach(function(record){

        if(
            !record.stocks ||
            !Array.isArray(record.stocks)
        ){
            return;
        }


        record.stocks.forEach(function(item){

            if(
                item.symbol === symbol &&
                item.price !== undefined
            ){

                values.push(
                    Number(item.price)
                );

            }

        });

    });


    var box =
        document.createElement("div");

    box.className =
        "chart-item";


    var title =
        document.createElement("div");

    title.className =
        "chart-symbol";

    title.textContent =
        symbol;


    box.appendChild(title);


    if(values.length < 2){

        var empty =
            document.createElement("div");

        empty.style.color =
            "#596573";

        empty.style.fontSize =
            "11px";

        empty.textContent =
            "正在积累走势数据……";

        box.appendChild(empty);

        return box;

    }


    var width = 1000;
    var height = 120;
    var padding = 8;


    var min =
        Math.min.apply(null,values);

    var max =
        Math.max.apply(null,values);


    if(max === min){

        max = min + 1;

    }


    var points = [];


    values.forEach(function(value,index){

        var x =
            padding +
            (
                index /
                (values.length - 1)
            ) *
            (width - padding * 2);


        var y =
            height -
            padding -
            (
                (value - min) /
                (max - min)
            ) *
            (height - padding * 2);


        points.push(
            x.toFixed(2) +
            "," +
            y.toFixed(2)
        );

    });


    var svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svg.setAttribute(
        "viewBox",
        "0 0 1000 120"
    );

    svg.setAttribute(
        "preserveAspectRatio",
        "none"
    );

    svg.setAttribute(
        "class",
        "chart-svg"
    );


    /* 网格线 */

    for(
        var i=1;
        i<4;
        i++
    ){

        var line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1","0"
        );

        line.setAttribute(
            "x2","1000"
        );

        line.setAttribute(
            "y1",
            i * 30
        );

        line.setAttribute(
            "y2",
            i * 30
        );

        line.setAttribute(
            "stroke",
            "#1b2027"
        );

        line.setAttribute(
            "stroke-width",
            "1"
        );

        svg.appendChild(line);

    }


    /* 走势 */

    var polyline =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );

    polyline.setAttribute(
        "points",
        points.join(" ")
    );

    polyline.setAttribute(
        "fill",
        "none"
    );

    polyline.setAttribute(
        "stroke",
        "#19d889"
    );

    polyline.setAttribute(
        "stroke-width",
        "2.5"
    );

    svg.appendChild(polyline);


    box.appendChild(svg);


    return box;

}


/* ==================================================
   更新走势图
================================================== */

var currentHistoryCount = 20;


function updateCharts(data){

    var container =
        document.getElementById(
            "charts"
        );


    container.innerHTML = "";


    if(
        !data.history ||
        !Array.isArray(data.history)
    ){

        document.getElementById(
            "historyCount"
        ).textContent =
            "0 次记录";

        return;

    }


    var history =
        data.history.slice(
            -currentHistoryCount
        );


    document.getElementById(
        "historyCount"
    ).textContent =
        history.length +
        " 次记录";


    var symbols = [
        "NVDA",
        "TSLA",
        "AAPL",
        "MSTR",
        "STRC"
    ];


    symbols.forEach(function(symbol){

        container.appendChild(
            makeChart(
                symbol,
                history
            )
        );

    });

}


/* ==================================================
   获取 data.json
================================================== */

function loadData(){

    var url =
        DATA_URL +
        "?t=" +
        new Date().getTime();


    fetch(
        url,
        {
            cache:"no-store"
        }
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        return response.json();

    })

    .then(function(data){

        if(!data || !data.success){

            throw new Error(
                "data.json 数据无效"
            );

        }


        updateStocks(data);

        updateIndices(data);

        updateCrypto(data);

        updateCharts(data);


        if(data.updatedAt){

            var time =
                new Date(
                    data.updatedAt
                );


            document.getElementById(
                "updated"
            ).textContent =
                time.toLocaleTimeString(
                    "zh-CN",
                    {
                        hour12:false
                    }
                );

        }


        if(data.marketStatus){

            document.getElementById(
                "marketStatus"
            ).textContent =
                data.marketStatus;

        }
        else{

            document.getElementById(
                "marketStatus"
            ).textContent =
                "行情正常";

        }

    })

    .catch(function(error){

        console.log(
            "行情获取失败:",
            error
        );

        document.getElementById(
            "marketStatus"
        ).textContent =
            "行情暂时无法获取";

    });

}


/* ==================================================
   走势按钮
================================================== */

var buttons =
    document.querySelectorAll(
        ".chart-button"
    );


buttons.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            buttons.forEach(
                function(b){
                    b.className =
                        "chart-button";
                }
            );


            button.className =
                "chart-button active";


            currentHistoryCount =
                Number(
                    button.getAttribute(
                        "data-count"
                    )
                );


            loadData();

        }
    );

});


/* ==================================================
   首次加载
================================================== */

loadData();


/* ==================================================
   每 30 秒刷新
================================================== */

setInterval(
    loadData,
    30000
);

</script>

</body>
</html>
