<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">

<title>美股行情</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    background:#05070a;
    color:#f4f7fb;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
}

.wrap{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:18px 14px 40px;
}

/* =========================
   顶部
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:14px;
    border-bottom:1px solid #20252d;
}

.title{
    font-size:28px;
    font-weight:800;
    letter-spacing:.5px;
}

.subtitle{
    margin-top:5px;
    color:#7e8a9b;
    font-size:12px;
}

.clock{
    color:#8fb9ff;
    font-size:13px;
    padding-top:3px;
}

/* =========================
   股票
========================= */

.stock-list{
    margin-top:4px;
}

.stock-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    min-height:62px;
    border-bottom:1px solid #20252d;
}

.stock-symbol{
    font-size:22px;
    font-weight:800;
}

.stock-price{
    text-align:center;
    font-size:20px;
    font-weight:800;
}

.stock-change{
    text-align:right;
    font-size:17px;
    font-weight:800;
}

.green{
    color:#00d995;
}

.red{
    color:#ff4767;
}

.gray{
    color:#7e8a9b;
}

/* =========================
   区块标题
========================= */

.section-title{
    margin-top:14px;
    margin-bottom:7px;
    color:#82a8d9;
    font-size:13px;
    letter-spacing:.2px;
}

/* =========================
   指数
========================= */

.index-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.index-card{
    background:#0d1117;
    border-radius:8px;
    padding:9px 10px;
    min-height:54px;
}

.index-name{
    color:#8da3c4;
    font-size:12px;
}

.index-price{
    margin-top:2px;
    font-size:18px;
    font-weight:700;
}

.index-change{
    font-size:13px;
    font-weight:700;
    margin-left:5px;
}

/* =========================
   加密货币
========================= */

.crypto-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.crypto-card{
    background:#0d1117;
    border-radius:8px;
    padding:10px;
    min-height:72px;
}

.crypto-name{
    font-size:15px;
    font-weight:800;
}

.crypto-price{
    margin-top:3px;
    color:#9bb0ce;
    font-size:15px;
    font-weight:700;
}

.crypto-change{
    margin-top:2px;
    font-size:12px;
    font-weight:700;
}

/* =========================
   行情走势
========================= */

.chart-panel{
    margin-top:16px;
    padding:12px;
    background:#0b0f14;
    border:1px solid #1d2530;
    border-radius:10px;
}

.chart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.chart-title{
    font-size:14px;
    color:#91a8ca;
}

.chart-info{
    font-size:11px;
    color:#667386;
}

.chart-buttons{
    display:flex;
    gap:5px;
    margin-top:9px;
}

.chart-button{
    border:0;
    background:#161d26;
    color:#8390a2;
    border-radius:6px;
    padding:5px 9px;
    font-size:11px;
}

.chart-button.active{
    background:#263d60;
    color:#b9d4ff;
}

.chart-stock{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #1c222b;
}

.chart-stock-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
}

.chart-symbol{
    font-size:14px;
    font-weight:800;
}

.chart-last{
    font-size:12px;
    color:#93a7c5;
}

canvas{
    display:block;
    width:100%;
    height:90px;
}

/* =========================
   底部状态
========================= */

.status{
    text-align:center;
    margin-top:13px;
    color:#647286;
    font-size:11px;
    line-height:1.7;
}

/* =========================
   手机适配
========================= */

@media(max-width:600px){

    .wrap{
        padding:14px 10px 30px;
    }

    .title{
        font-size:24px;
    }

    .stock-row{
        min-height:58px;
    }

    .stock-symbol{
        font-size:19px;
    }

    .stock-price{
        font-size:17px;
    }

    .stock-change{
        font-size:14px;
    }

    .crypto-grid{
        grid-template-columns:1fr 1fr;
    }

    .crypto-card{
        min-height:68px;
    }
}

@media(max-width:380px){

    .title{
        font-size:22px;
    }

    .stock-symbol{
        font-size:17px;
    }

    .stock-price{
        font-size:16px;
    }

    .stock-change{
        font-size:13px;
    }

    .clock{
        font-size:11px;
    }
}
</style>

<script>

/* =========================================================
   基本设置
========================================================= */

var STOCKS = [
    "NVDA",
    "TSLA",
    "AAPL",
    "MSTR",
    "STRC"
];

var CRYPTO = [
    "BTC",
    "ETH",
    "BNB",
    "OKB"
];

var RANGE = 20;

var DATA_URL = "data.json";


/* =========================================================
   工具
========================================================= */

function $(id){
    return document.getElementById(id);
}


function formatMoney(value){

    if(value === null ||
       value === undefined ||
       isNaN(value)){
        return "--";
    }

    return "$" + Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


function formatChange(value){

    if(value === null ||
       value === undefined ||
       isNaN(value)){
        return "--";
    }

    var n = Number(value);

    if(n > 0){
        return "▲ +" + n.toFixed(2) + "%";
    }

    if(n < 0){
        return "▼ " + n.toFixed(2) + "%";
    }

    return "— 0.00%";
}


function changeClass(value){

    if(value > 0){
        return "green";
    }

    if(value < 0){
        return "red";
    }

    return "gray";
}


/* =========================================================
   时钟
========================================================= */

function updateClock(){

    var d = new Date();

    var h = String(d.getHours()).padStart(2,"0");
    var m = String(d.getMinutes()).padStart(2,"0");
    var s = String(d.getSeconds()).padStart(2,"0");

    $("clock").textContent =
        h + ":" + m + ":" + s;
}

setInterval(updateClock,1000);

updateClock();


/* =========================================================
   本地走势历史
========================================================= */

function loadHistory(){

    try{

        var text =
            localStorage.getItem(
                "stockBoardHistoryV1"
            );

        if(!text){
            return [];
        }

        var arr = JSON.parse(text);

        if(Array.isArray(arr)){
            return arr;
        }

    }catch(e){}

    return [];
}


function saveHistory(history){

    try{

        /*
         * 最多保存500次
         * 防止老 iPhone localStorage 太大
         */

        if(history.length > 500){

            history =
                history.slice(
                    history.length - 500
                );
        }

        localStorage.setItem(
            "stockBoardHistoryV1",
            JSON.stringify(history)
        );

    }catch(e){}
}


/* =========================================================
   保存当前行情
========================================================= */

function recordHistory(data){

    if(!data ||
       !Array.isArray(data.stocks)){
        return;
    }

    var history = loadHistory();

    var item = {
        time: Date.now(),
        stocks:{}
    };


    data.stocks.forEach(function(stock){

        if(stock &&
           stock.symbol &&
           typeof stock.price === "number"){

            item.stocks[
                stock.symbol
            ] = Number(stock.price);
        }

    });


    /*
     * 避免同一分钟反复刷新产生大量重复点
     */

    if(history.length){

        var last =
            history[history.length - 1];

        if(
            last.stocks &&
            last.stocks.NVDA === item.stocks.NVDA &&
            last.stocks.TSLA === item.stocks.TSLA &&
            last.stocks.AAPL === item.stocks.AAPL &&
            last.stocks.MSTR === item.stocks.MSTR &&
            last.stocks.STRC === item.stocks.STRC
        ){

            return;
        }
    }


    history.push(item);

    saveHistory(history);
}


/* =========================================================
   画走势
========================================================= */

function drawLineChart(
    canvasId,
    ticker
){

    var canvas = $(canvasId);

    if(!canvas){
        return;
    }

    var rect =
        canvas.getBoundingClientRect();

    var width =
        Math.max(
            280,
            Math.floor(rect.width)
        );

    var height = 90;

    var dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    var ctx =
        canvas.getContext("2d");

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    var history =
        loadHistory();


    var values = [];


    for(
        var i =
            Math.max(
                0,
                history.length - RANGE
            );
        i < history.length;
        i++
    ){

        var p =
            history[i] &&
            history[i].stocks
                ? history[i].stocks[ticker]
                : null;

        if(
            typeof p === "number" &&
            isFinite(p)
        ){

            values.push(p);
        }
    }


    /*
     * 没有足够数据
     */

    if(values.length < 2){

        ctx.fillStyle =
            "#5e6b7d";

        ctx.font =
            "11px sans-serif";

        ctx.fillText(
            "正在积累走势数据……",
            5,
            35
        );

        return;
    }


    var min =
        Math.min.apply(
            Math,
            values
        );

    var max =
        Math.max.apply(
            Math,
            values
        );


    /*
     * 如果价格完全一样
     */

    if(max === min){

        max += 1;
        min -= 1;
    }


    var paddingTop = 8;
    var paddingBottom = 8;
    var chartHeight =
        height -
        paddingTop -
        paddingBottom;


    /*
     * 背景网格
     */

    ctx.strokeStyle =
        "#171d25";

    ctx.lineWidth = 1;


    for(
        var g=1;
        g<=3;
        g++
    ){

        var gy =
            paddingTop +
            chartHeight *
            g / 4;

        ctx.beginPath();

        ctx.moveTo(
            0,
            gy
        );

        ctx.lineTo(
            width,
            gy
        );

        ctx.stroke();
    }


    /*
     * 判断涨跌
     */

    var first =
        values[0];

    var last =
        values[
            values.length - 1
        ];

    var lineColor =
        last >= first
        ? "#00d995"
        : "#ff4767";


    /*
     * 走势线
     */

    ctx.beginPath();


    for(
        var j=0;
        j<values.length;
        j++
    ){

        var x =
            j /
            (values.length - 1) *
            width;


        var y =
            paddingTop +
            (
                1 -
                (
                    values[j] - min
                ) /
                (max - min)
            ) *
            chartHeight;


        if(j === 0){

            ctx.moveTo(
                x,
                y
            );

        }else{

            ctx.lineTo(
                x,
                y
            );
        }
    }


    ctx.strokeStyle =
        lineColor;

    ctx.lineWidth = 2;

    ctx.stroke();


    /*
     * 最后一个点
     */

    var lastX = width;

    var lastY =
        paddingTop +
        (
            1 -
            (
                last - min
            ) /
            (max - min)
        ) *
        chartHeight;


    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        lineColor;

    ctx.fill();
}


/* =========================================================
   更新所有走势图
========================================================= */

function drawAllCharts(){

    drawLineChart(
        "chartNVDA",
        "NVDA"
    );

    drawLineChart(
        "chartTSLA",
        "TSLA"
    );

    drawLineChart(
        "chartAAPL",
        "AAPL"
    );

    drawLineChart(
        "chartMSTR",
        "MSTR"
    );

    drawLineChart(
        "chartSTRC",
        "STRC"
    );


    var history =
        loadHistory();

    $("chartInfo").textContent =
        history.length +
        " 次记录";
}


/* =========================================================
   切换走势图范围
========================================================= */

function changeRange(
    range,
    button
){

    RANGE = range;

    var buttons =
        document.getElementsByClassName(
            "chart-button"
        );

    for(
        var i=0;
        i<buttons.length;
        i++
    ){

        buttons[i].className =
            "chart-button";
    }


    button.className =
        "chart-button active";


    drawAllCharts();
}


/* =========================================================
   股票显示
========================================================= */

function renderStocks(data){

    var box =
        $("stocks");

    if(
        !data ||
        !Array.isArray(data.stocks)
    ){
        return;
    }


    var html = "";


    STOCKS.forEach(function(symbol){

        var stock = null;


        for(
            var i=0;
            i<data.stocks.length;
            i++
        ){

            if(
                data.stocks[i] &&
                data.stocks[i].symbol === symbol
            ){

                stock =
                    data.stocks[i];

                break;
            }
        }


        if(!stock){

            html +=
                '<div class="stock-row">' +
                    '<div class="stock-symbol">' +
                        symbol +
                    '</div>' +

                    '<div class="stock-price">' +
                        '--' +
                    '</div>' +

                    '<div class="stock-change gray">' +
                        '--' +
                    '</div>' +
                '</div>';

            return;
        }


        var price =
            Number(stock.price);

        var change =
            Number(stock.change);


        html +=
            '<div class="stock-row">' +

                '<div class="stock-symbol">' +
                    symbol +
                '</div>' +

                '<div class="stock-price">' +
                    formatMoney(price) +
                '</div>' +

                '<div class="stock-change ' +
                    changeClass(change) +
                '">' +
                    formatChange(change) +
                '</div>' +

            '</div>';
    });


    box.innerHTML =
        html;
}


/* =========================================================
   指数
========================================================= */

function renderIndexes(data){

    if(
        !data ||
        !Array.isArray(data.indexes)
    ){

        /*
         * 如果你的 data.json 没有 indexes
         * 就保持当前页面，不报错
         */

        return;
    }


    var cards =
        document.querySelectorAll(
            "#indexes .index-card"
        );


    for(
        var i=0;
        i<data.indexes.length &&
        i<cards.length;
        i++
    ){

        var item =
            data.indexes[i];

        if(!item){
            continue;
        }


        var price =
            Number(item.price);

        var change =
            Number(item.change);


        var priceEl =
            cards[i].querySelector(
                ".index-price"
            );

        var changeEl =
            cards[i].querySelector(
                ".index-change"
            );


        if(priceEl){

            priceEl.textContent =
                isFinite(price)
                ? Number(price).toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits:2,
                        maximumFractionDigits:2
                    }
                )
                : "--";
        }


        if(changeEl){

            changeEl.textContent =
                formatChange(change);

            changeEl.className =
                "index-change " +
                changeClass(change);
        }
    }
}


/* =========================================================
   加密货币
========================================================= */

function renderCrypto(data){

    if(
        !data ||
        !Array.isArray(data.crypto)
    ){

        return;
    }


    var cards =
        document.querySelectorAll(
            "#crypto .crypto-card"
        );


    for(
        var i=0;
        i<data.crypto.length &&
        i<cards.length;
        i++
    ){

        var item =
            data.crypto[i];

        if(!item){
            continue;
        }


        var price =
            Number(item.price);

        var change =
            Number(item.change);


        var priceEl =
            cards[i].querySelector(
                ".crypto-price"
            );

        var changeEl =
            cards[i].querySelector(
                ".crypto-change"
            );


        if(priceEl){

            priceEl.textContent =
                formatMoney(price);
        }


        if(changeEl){

            changeEl.textContent =
                formatChange(change);

            changeEl.className =
                "crypto-change " +
                changeClass(change);
        }
    }
}


/* =========================================================
   获取 data.json
========================================================= */

function loadData(){

    var url =
        DATA_URL +
        "?t=" +
        Date.now();


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function(){

            if(
                xhr.readyState !== 4
            ){

                return;
            }


            if(
                xhr.status >= 200 &&
                xhr.status < 300
            ){

                try{

                    var data =
                        JSON.parse(
                            xhr.responseText
                        );


                    renderStocks(data);

                    renderIndexes(data);

                    renderCrypto(data);


                    /*
                     * 保存行情历史
                     */

                    recordHistory(data);


                    /*
                     * 更新走势
                     */

                    drawAllCharts();


                    /*
                     * 状态
                     */

                    if(
                        data.marketStatus
                    ){

                        $("marketStatus")
                            .textContent =
                            data.marketStatus;
                    }


                    if(
                        data.updatedAt
                    ){

                        var d =
                            new Date(
                                data.updatedAt
                            );


                        $("lastUpdate")
                            .textContent =
                            "最后更新：" +
                            d.toLocaleTimeString(
                                "zh-CN",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit",
                                    second:"2-digit"
                                }
                            );
                    }


                }catch(e){

                    console.log(
                        "data.json 解析失败",
                        e
                    );

                    $("marketStatus")
                        .textContent =
                        "行情数据格式错误";
                }


            }else{

                $("marketStatus")
                    .textContent =
                    "行情暂时无法获取";
            }
        };


    xhr.onerror =
        function(){

            $("marketStatus")
                .textContent =
                "网络连接失败";
        };


    xhr.send(null);
}


/* =========================================================
   启动
========================================================= */

loadData();


/*
 * 每60秒读取一次 data.json
 */

setInterval(
    loadData,
    60000
);


/*
 * 屏幕尺寸改变
 */

window.onresize =
    function(){

        drawAllCharts();
    };


</script>
