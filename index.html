<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>股票钉盘 V3.1</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#07090c;
color:#f4f6f8;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
overflow:hidden
}

*{box-sizing:border-box}

#app{
min-height:100vh;
padding:9px 13px
}

.head{
display:flex;
justify-content:space-between;
align-items:flex-end;
border-bottom:1px solid #272c34;
padding-bottom:7px;
margin-bottom:2px
}

.title{
font-size:21px;
font-weight:700
}

.sub{
font-size:9px;
color:#7f8996;
margin-top:2px
}

#clock{
text-align:right;
font-size:12px;
color:#aab2bd;
line-height:1.3
}

.row{
display:flex;
align-items:center;
height:43px;
border-bottom:1px solid #1b1f25
}

.sym{
width:20%;
font-size:17px;
font-weight:700
}

.pr{
width:43%;
text-align:right;
font-size:17px;
font-weight:700
}

.ch{
width:37%;
text-align:right;
font-size:15px;
font-weight:700
}

.up{color:#22c77a}
.down{color:#ff5964}
.flat{color:#aab2bd}

.indexbox{
display:flex;
gap:8px;
padding:7px 0;
border-bottom:1px solid #1b1f25
}

.idx{
flex:1;
background:#0d1015;
padding:5px 7px;
border-radius:5px
}

.idxname{
font-size:10px;
color:#89929e
}

.idxval{
font-size:13px;
font-weight:700;
margin-top:2px
}

.cryptoTitle{
font-size:10px;
color:#89929e;
padding:6px 1px 3px
}

.cryptobox{
display:flex;
gap:7px
}

.coin{
flex:1;
background:#0d1015;
border-radius:5px;
padding:5px 6px;
min-width:0
}

.coinname{
font-size:11px;
font-weight:700
}

.coinprice{
font-size:13px;
font-weight:700;
margin-top:2px
}

.coinpct{
font-size:10px;
font-weight:700;
margin-top:1px
}

.status{
text-align:center;
font-size:8px;
color:#68717d;
margin-top:6px
}

@media (orientation:landscape){

#app{
padding:7px 10px
}

.head{
padding-bottom:5px
}

.title{
font-size:18px
}

.sub{
font-size:8px
}

.row{
height:39px
}

.sym{
font-size:16px
}

.pr{
font-size:16px
}

.ch{
font-size:14px
}

.indexbox{
padding:5px 0
}

.cryptoTitle{
padding:4px 1px 2px
}

.coin{
padding:4px 6px
}

.coinprice{
font-size:12px
}

.status{
margin-top:3px
}

}
</style>
</head>

<body>

<div id="app">

<div class="head">
<div>
<div class="title">美股行情</div>
<div class="sub">iPhone 6 Plus · 自动更新</div>
</div>

<div id="clock">--:--:--</div>
</div>

<div id="rows"></div>

<div class="indexbox">

<div class="idx">
<div class="idxname">NASDAQ</div>
<div id="ndx" class="idxval flat">--</div>
</div>

<div class="idx">
<div class="idxname">S&amp;P 500</div>
<div id="spx" class="idxval flat">--</div>
</div>

</div>

<div class="cryptoTitle">
CRYPTO · 加密货币
</div>

<div class="cryptobox" id="crypto"></div>

<div id="marketStatus" class="status">
正在判断市场状态…
</div>

<div id="status" class="status">
正在获取行情…
</div>

</div>

<script>

(function(){

var stocks=[
{s:"NVDA",id:"105.NVDA"},
{s:"TSLA",id:"105.TSLA"},
{s:"AAPL",id:"105.AAPL"},
{s:"MSTR",id:"105.MSTR"},
{s:"STRC",id:"105.STRC"}
];

var coins=[
{s:"BTC",id:"BTC-USDT"},
{s:"ETH",id:"ETH-USDT"},
{s:"BNB",id:"BNB-USDT"},
{s:"OKB",id:"OKB-USDT"}
];

var latest={};

function fmtPrice(v){
return isFinite(v)?"$"+Number(v).toFixed(2):"--";
}

function fmtPct(v){
if(!isFinite(v))return"--";
var n=Number(v);
return(n>0?"+":"")+n.toFixed(2)+"%";
}

function pctClass(v){
return v>0?"up":(v<0?"down":"flat");
}

function drawStocks(){

var h="";

for(var i=0;i<stocks.length;i++){

var k=stocks[i].s;
var d=latest[k]||{};
var v=d.price;
var p=d.pct;

h+=
'<div class="row">'+
'<div class="sym">'+k+'</div>'+
'<div class="pr">'+fmtPrice(v)+'</div>'+
'<div class="ch '+pctClass(p)+'">'+
(p>0?"▲ ":p<0?"▼ ":"")+
fmtPct(p)+
'</div>'+
'</div>';

}

document.getElementById("rows").innerHTML=h;

}

function receiveStock(name,data){

if(!data)return;

latest[name]={
price:Number(data.f43)/1000,
pct:Number(data.f170)/100
};

drawStocks();

}

function receiveIndex(id,data){

if(!data)return;

var price=Number(data.f43)/1000;
var p=Number(data.f170)/100;

var el=document.getElementById(id);

el.className="idxval "+pctClass(p);

el.innerHTML=
(isFinite(price)?Number(price).toFixed(2):"--")+
" "+
(p>0?"▲ ":p<0?"▼ ":"")+
fmtPct(p);

}

function jsonp(url,handler){

var sc=document.createElement("script");

var cb=
"cb_"+
new Date().getTime()+
"_"+
Math.floor(Math.random()*100000);

window[cb]=function(json){

try{

handler(json&&json.data);

}finally{

try{
delete window[cb];
}catch(e){
window[cb]=null;
}

if(sc.parentNode){
sc.parentNode.removeChild(sc);
}

}

};

sc.src=
url+
"&cb="+
cb+
"&_="+
new Date().getTime();

document.body.appendChild(sc);

}

function loadStocks(){

for(var i=0;i<stocks.length;i++){

(function(item){

jsonp(
"https://push2.eastmoney.com/api/qt/stock/get?secid="+
encodeURIComponent(item.id)+
"&fields=f43,f57,f58,f60,f170",

function(d){
receiveStock(item.s,d);
}

);

})(stocks[i]);

}

jsonp(
"https://push2.eastmoney.com/api/qt/stock/get?secid=100.NDX&fields=f43,f57,f58,f60,f170",
function(d){
receiveIndex("ndx",d);
}
);

jsonp(
"https://push2.eastmoney.com/api/qt/stock/get?secid=100.SPX&fields=f43,f57,f58,f60,f170",
function(d){
receiveIndex("spx",d);
}
);

}

function drawCrypto(data){

var h="";

for(var i=0;i<coins.length;i++){

var c=coins[i];
var d=data[c.id]||{};

var v=Number(d.last);
var open=Number(d.open24h);

var p=
(isFinite(v)&&
isFinite(open)&&
open!==0)
?
(v-open)/open*100
:
NaN;

var price=
isFinite(v)
?
(
v>=1000
?
"$"+v.toLocaleString("en-US",{maximumFractionDigits:0})
:
"$"+v.toFixed(2)
)
:
"--";

h+=
'<div class="coin">'+
'<div class="coinname">'+c.s+'</div>'+
'<div class="coinprice">'+price+'</div>'+
'<div class="coinpct '+pctClass(p)+'">'+
(p>0?"▲ ":p<0?"▼ ":"")+
fmtPct(p)+
'</div>'+
'</div>';

}

document.getElementById("crypto").innerHTML=h;

}

function loadCrypto(){

var x=new XMLHttpRequest();

x.open(
"GET",
"https://www.okx.com/api/v5/market/tickers?instType=SPOT",
true
);

x.onreadystatechange=function(){

if(x.readyState===4&&x.status===200){

try{

var all=
JSON.parse(x.responseText).data||[];

var pick={};

for(var i=0;i<all.length;i++){

if(
all[i].instId==="BTC-USDT"||
all[i].instId==="ETH-USDT"||
all[i].instId==="BNB-USDT"||
all[i].instId==="OKB-USDT"
){

pick[all[i].instId]=all[i];

}

}

drawCrypto(pick);

}catch(e){}

}

};

x.send(null);

}

function loadAll(){

loadStocks();

loadCrypto();

document.getElementById("status").innerHTML=
"最后更新 · "+
new Date().toLocaleTimeString();

}

function clock(){

var d=new Date();

var h=("0"+d.getHours()).slice(-2);
var m=("0"+d.getMinutes()).slice(-2);
var s=("0"+d.getSeconds()).slice(-2);

document.getElementById("clock").innerHTML=
h+":"+m+":"+s;

}

function market(){

var d=new Date();

var day=d.getDay();
var h=d.getHours();
var m=d.getMinutes();

var el=document.getElementById("marketStatus");

if(day===0||day===6){

el.innerHTML="美股休市 · 周末";

return;

}

el.innerHTML=
"美股行情看板 · 北京时间 "+
(("0"+h).slice(-2))+
":"+
(("0"+m).slice(-2));

}

clock();
market();
drawStocks();
loadAll();

setInterval(clock,1000);
setInterval(market,30000);
setInterval(loadAll,30000);

})();

</script>

</body>
</html>
