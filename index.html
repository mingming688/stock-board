<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#050608;
    color:#f5f7fa;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   主容器
========================= */

#app{

    width:100%;
    max-width:1200px;

    margin:0 auto;

    padding:12px;
}

/* =========================
   顶部
========================= */

.header{

    display:flex;

    justify-content:space-between;
    align-items:flex-end;

    padding-bottom:10px;
    margin-bottom:4px;

    border-bottom:1px solid #20242a;
}

.title{

    font-size:22px;

    font-weight:800;

    letter-spacing:.2px;
}

.subtitle{

    margin-top:3px;

    font-size:10px;

    color:#78818c;
}

.clock{

    font-size:12px;

    color:#9ca5af;

    white-space:nowrap;
}

/* =========================
   股票列表
========================= */

.stock-list{

    width:100%;
}

.stock-row{

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    align-items:center;

    min-height:48px;

    border-bottom:1px solid #20242a;
}

.stock-symbol{

    font-size:18px;

    font-weight:800;
}

.stock-price{

    text-align:center;

    font-size:17px;

    font-weight:750;

    font-variant-numeric:
        tabular-nums;
}

.stock-change{

    text-align:right;

    font-size:15px;

    font-weight:750;

    font-variant-numeric:
        tabular-nums;
}

/* =========================
   涨跌颜色
========================= */

.up{

    color:#19d889;
}

.down{

    color:#ff4d63;
}

.flat{

    color:#9aa3ad;
}

/* =========================
   分区标题
========================= */

.section-title{

    margin-top:10px;
    margin-bottom:5px;

    font-size:11px;

    color:#89939e;
}

/* =========================
   指数
========================= */

.index-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.index-card{

    background:#0c0f13;

    border-radius:6px;

    padding:7px 9px;

    min-height:44px;
}

.index-name{

    font-size:10px;

    color:#8d97a2;
}

.index-value{

    margin-top:2px;

    font-size:14px;

    font-weight:750;

    font-variant-numeric:
        tabular-nums;
}

/* =========================
   加密货币
========================= */

.crypto-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.crypto-card{

    background:#0c0f13;

    border-radius:6px;

    padding:7px 8px;

    min-height:55px;
}

.crypto-symbol{

    font-size:12px;

    font-weight:800;
}

.crypto-price{

    margin-top:2px;

    font-size:13px;

    font-weight:750;

    font-variant-numeric:
        tabular-nums;
}

.crypto-change{

    margin-top:1px;

    font-size:10px;

    font-weight:700;
}

/* =========================
   底部
========================= */

.footer{

    margin-top:8px;

    text-align:center;

    font-size:9px;

    line-height:1.5;

    color:#58616b;
}

/* =========================
   手机
========================= */

@media(max-width:600px){

    #app{

        padding:
            9px
            9px
            12px;
    }

    .title{

        font-size:21px;
    }

    .clock{

        font-size:11px;
    }

    .stock-row{

        min-height:49px;
    }

    .stock-symbol{

        font-size:17px;
    }

    .stock-price{

        font-size:16px;
    }

    .stock-change{

        font-size:14px;
    }

    .index-grid{

        gap:6px;
    }

    .index-card{

        padding:
            6px
            8px;
    }

    .index-value{

        font-size:13px;
    }

    .crypto-grid{

        gap:6px;
    }

    .crypto-card{

        padding:
            7px
            7px;
    }

    .crypto-symbol{

        font-size:11px;
    }

    .crypto-price{

        font-size:12px;
    }

}

/* =========================
   iPhone 6 Plus
========================= */

@media(max-width:414px){

    #app{

        padding:8px;
    }

    .header{

        padding-bottom:8px;
    }

    .title{

        font-size:20px;
    }

    .stock-row{

        min-height:47px;
    }

    .stock-symbol{

        font-size:17px;
    }

    .stock-price{

        font-size:16px;
    }

    .stock-change{

        font-size:14px;
    }

    .crypto-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:6px;
    }

    .crypto-card{

        min-height:52px;
    }

}

/* =========================
   很小屏幕
========================= */

@media(max-width:350px){

    .stock-symbol{

        font-size:16px;
    }

    .stock-price{

        font-size:15px;
    }

    .stock-change{

        font-size:13px;
    }

}

</style>

<script>


/* =====================================================
   这里非常重要

   不再使用 Cloudflare Worker。

   直接读取 GitHub Pages 同目录下的 data.json。

   index.html
   data.json

   两个文件在同一个目录。
===================================================== */


/* =========================
   格式化价格
========================= */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }


    return Number(value).toLocaleString(
        "en-US",
        {

            minimumFractionDigits:2,

            maximumFractionDigits:2

        }
    );

}


/* =========================
   格式化涨跌幅
========================= */

function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }


    var n = Number(value);


    if(n > 0){

        return "▲ +" +
            n.toFixed(2) +
            "%";

    }


    if(n < 0){

        return "▼ " +
            n.toFixed(2) +
            "%";

    }


    return "— 0.00%";

}


/* =========================
   涨跌颜色
========================= */

function changeClass(value){

    if(Number(value) > 0){

        return "up";

    }


    if(Number(value) < 0){

        return "down";

    }


    return "flat";

}


/* =========================
   时钟
========================= */

function updateClock(){

    var now =
        new Date();


    var h =
        String(
            now.getHours()
        ).padStart(2,"0");


    var m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    var s =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    var clock =
        document.getElementById(
            "clock"
        );


    if(clock){

        clock.textContent =
            h +
            ":" +
            m +
            ":" +
            s;

    }

}


setInterval(
    updateClock,
    1000
);


updateClock();



/* =========================
   更新美股
========================= */

function updateStocks(data){

    var map = {};


    if(
        data &&
        data.stocks &&
        Array.isArray(data.stocks)
    ){

        data.stocks.forEach(
            function(item){

                map[item.symbol] =
                    item;

            }
        );

    }


    var rows =
        document.querySelectorAll(
            ".stock-row"
        );


    rows.forEach(
        function(row){

            var symbolElement =
                row.querySelector(
                    ".stock-symbol"
                );


            var priceElement =
                row.querySelector(
                    ".stock-price"
                );


            var changeElement =
                row.querySelector(
                    ".stock-change"
                );


            if(
                !symbolElement ||
                !priceElement ||
                !changeElement
            ){

                return;

            }


            var symbol =
                symbolElement.textContent
                    .trim();


            var item =
                map[symbol];


            if(!item){

                return;

            }


            priceElement.textContent =
                "$" +
                formatPrice(
                    item.price
                );


            changeElement.textContent =
                formatPercent(
                    item.change
                );


            changeElement.className =
                "stock-change " +
                changeClass(
                    item.change
                );

        }
    );

}



/* =========================
   更新指数
========================= */

function updateIndices(data){

    if(
        !data ||
        !data.indices
    ){

        return;

    }


    /* NASDAQ */

    if(data.indices.nasdaq){

        var n =
            data.indices.nasdaq;


        var nasdaq =
            document.getElementById(
                "nasdaq"
            );


        if(nasdaq){

            nasdaq.innerHTML =

                formatPrice(
                    n.price
                ) +

                " " +

                '<span class="' +
                changeClass(
                    n.change
                ) +
                '">' +

                formatPercent(
                    n.change
                ) +

                "</span>";

        }

    }



    /* S&P 500 */

    if(data.indices.sp500){

        var s =
            data.indices.sp500;


        var sp500 =
            document.getElementById(
                "sp500"
            );


        if(sp500){

            sp500.innerHTML =

                formatPrice(
                    s.price
                ) +

                " " +

                '<span class="' +
                changeClass(
                    s.change
                ) +
                '">' +

                formatPercent(
                    s.change
                ) +

                "</span>";

        }

    }

}



/* =========================
   更新加密货币
========================= */

function updateCrypto(data){

    if(
        !data ||
        !data.crypto ||
        !Array.isArray(data.crypto)
    ){

        return;

    }


    var map = {};


    data.crypto.forEach(
        function(item){

            map[item.symbol] =
                item;

        }
    );


    var cards =
        document.querySelectorAll(
            ".crypto-card"
        );


    cards.forEach(
        function(card){

            var symbolElement =
                card.querySelector(
                    ".crypto-symbol"
                );


            var priceElement =
                card.querySelector(
                    ".crypto-price"
                );


            var changeElement =
                card.querySelector(
                    ".crypto-change"
                );


            if(
                !symbolElement ||
                !priceElement ||
                !changeElement
            ){

                return;

            }


            var symbol =
                symbolElement.textContent
                    .trim();


            var item =
                map[symbol];


            if(!item){

                return;

            }


            priceElement.textContent =
                "$" +
                formatPrice(
                    item.price
                );


            changeElement.textContent =
                formatPercent(
                    item.change
                );


            changeElement.className =
                "crypto-change " +
                changeClass(
                    item.change
                );

        }
    );

}



/* =====================================================
   从 GitHub Pages 获取 data.json
===================================================== */

async function loadData(){

    try{


        /*
         * ./data.json
         *
         * 意思是：
         * 和 index.html 在同一个目录。
         *
         * 加时间戳是为了避免 iPhone Safari
         * 使用旧缓存。
         */

        var url =
            "./data.json?t=" +
            Date.now();


        var response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "data.json 加载失败 HTTP " +
                response.status
            );

        }


        var data =
            await response.json();


        console.log(
            "行情数据:",
            data
        );


        if(
            !data ||
            data.success !== true
        ){

            console.error(
                "data.json 数据异常:",
                data
            );

            return;

        }


        /* 更新股票 */

        updateStocks(
            data
        );


        /* 更新指数 */

        updateIndices(
            data
        );


        /* 更新加密货币 */

        updateCrypto(
            data
        );


        /* 更新时间 */

        if(data.updatedAt){

            var time =
                new Date(
                    data.updatedAt
                );


            var updated =
                document.getElementById(
                    "updated"
                );


            if(updated){

                updated.textContent =
                    time.toLocaleTimeString(
                        "zh-CN",
                        {
                            hour12:false
                        }
                    );

            }

        }


    }
    catch(error){

        console.error(
            "行情获取失败:",
            error
        );

    }

}



/* =====================================================
   页面第一次打开
===================================================== */

loadData();



/* =====================================================
   每 30 秒重新读取一次 data.json
===================================================== */

setInterval(
    loadData,
    30000
);


</script>
