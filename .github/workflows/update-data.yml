name: Update Market Data

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        env:
          TZ: Asia/Shanghai
        run: |

          node <<'EOF'

          const fs = require("fs");


          // =========================================
          // 通用 JSON 请求
          // =========================================

          async function getJSON(url) {

            const response = await fetch(url, {
              headers: {
                "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              }
            });

            if (!response.ok) {

              throw new Error(
                `${response.status} ${response.statusText}`
              );

            }

            return await response.json();

          }


          // =========================================
          // Yahoo Finance 股票行情
          // =========================================

          async function yahoo(symbol) {

            const url =
              "https://query1.finance.yahoo.com/v8/finance/chart/" +
              encodeURIComponent(symbol) +
              "?range=1d" +
              "&interval=1m" +
              "&includePrePost=true";

            const data =
              await getJSON(url);

            if (
              !data.chart ||
              !data.chart.result ||
              !data.chart.result[0]
            ) {

              throw new Error(
                "Yahoo Finance 没有返回有效数据"
              );

            }


            const result =
              data.chart.result[0];

            const meta =
              result.meta || {};

            const timestamps =
              result.timestamp || [];

            const quote =
              result.indicators &&
              result.indicators.quote &&
              result.indicators.quote[0];


            if (!quote) {

              throw new Error(
                "没有找到行情数据"
              );

            }


            const closes =
              quote.close || [];


            // =====================================
            // 找到最后一个有效的 1 分钟价格
            // =====================================

            let latestPrice = null;
            let latestTimestamp = null;


            for (
              let i = closes.length - 1;
              i >= 0;
              i--
            ) {

              if (
                closes[i] !== null &&
                closes[i] !== undefined &&
                Number.isFinite(
                  Number(closes[i])
                )
              ) {

                latestPrice =
                  Number(closes[i]);

                latestTimestamp =
                  timestamps[i] || null;

                break;

              }

            }


            // =====================================
            // 如果 1 分钟数据没有价格
            // 使用 Yahoo 的市场价格
            // =====================================

            if (
              latestPrice === null &&
              meta.regularMarketPrice !== undefined
            ) {

              latestPrice =
                Number(
                  meta.regularMarketPrice
                );

              latestTimestamp =
                meta.regularMarketTime || null;

            }


            if (
              latestPrice === null ||
              !Number.isFinite(latestPrice)
            ) {

              throw new Error(
                "无法取得有效价格"
              );

            }


            // =====================================
            // 前一交易日收盘价
            // =====================================

            const previousClose =
              Number(
                meta.previousClose ||
                meta.chartPreviousClose ||
                0
              );


            let change = 0;


            if (
              previousClose &&
              Number.isFinite(previousClose)
            ) {

              change =
                (
                  (latestPrice - previousClose)
                  /
                  previousClose
                ) * 100;

            }


            // =====================================
            // 市场状态
            // =====================================

            let marketState =
              meta.marketState || "";


            let marketStatus =
              "未知";


            if (
              marketState === "REGULAR"
            ) {

              marketStatus =
                "美股交易中";

            }
            else if (
              marketState === "PRE"
            ) {

              marketStatus =
                "美股盘前";

            }
            else if (
              marketState === "POST"
            ) {

              marketStatus =
                "美股盘后";

            }
            else if (
              marketState === "PREPRE"
            ) {

              marketStatus =
                "美股盘前";

            }
            else {

              marketStatus =
                "美股休市";

            }


            return {

              symbol,

              price:
                latestPrice,

              change,

              previousClose,

              marketState,

              marketStatus,

              priceTime:
                latestTimestamp
                  ? new Date(
                      latestTimestamp * 1000
                    ).toISOString()
                  : null

            };

          }


          // =========================================
          // Binance 加密货币
          // =========================================

          async function binance(symbol) {

            const url =
              "https://api.binance.com/api/v3/ticker/24hr?symbol=" +
              symbol +
              "USDT";


            const data =
              await getJSON(url);


            return {

              symbol,

              price:
                Number(
                  data.lastPrice
                ),

              change:
                Number(
                  data.priceChangePercent
                )

            };

          }


          // =========================================
          // OKX OKB
          // =========================================

          async function okxOKB() {

            const url =
              "https://www.okx.com/api/v5/market/ticker?instId=OKB-USDT";


            const response =
              await getJSON(url);


            const item =
              response.data[0];


            const price =
              Number(
                item.last
              );


            const open =
              Number(
                item.sodUtc0
              );


            let change = 0;


            if (open) {

              change =
                (
                  (price - open)
                  /
                  open
                ) * 100;

            }


            return {

              symbol: "OKB",

              price,

              change

            };

          }


          // =========================================
          // 主程序
          // =========================================

          async function main() {

            console.log(
              "================================="
            );

            console.log(
              "开始获取最新行情"
            );

            console.log(
              new Date().toISOString()
            );

            console.log(
              "================================="
            );


            // =====================================
            // 股票
            // =====================================

            const stocks = [];


            const stockSymbols = [

              "NVDA",
              "TSLA",
              "AAPL",
              "MSTR",
              "STRC"

            ];


            for (
              const symbol
              of stockSymbols
            ) {

              try {

                const item =
                  await yahoo(symbol);


                console.log(
                  "股票:",
                  symbol,
                  "价格:",
                  item.price,
                  "涨跌:",
                  item.change,
                  "状态:",
                  item.marketStatus,
                  "时间:",
                  item.priceTime
                );


                stocks.push(item);

              }
              catch(error) {

                console.error(
                  "股票失败:",
                  symbol,
                  error.message
                );


                stocks.push({

                  symbol,

                  price: 0,

                  change: 0,

                  previousClose: 0,

                  marketState: "",

                  marketStatus:
                    "数据获取失败",

                  priceTime: null

                });

              }

            }


            // =====================================
            // NASDAQ
            // =====================================

            let nasdaq;


            try {

              nasdaq =
                await yahoo("^IXIC");

            }
            catch(error) {

              console.error(
                "NASDAQ失败:",
                error.message
              );


              nasdaq = {

                symbol: "^IXIC",

                price: 0,

                change: 0,

                marketStatus:
                  "数据获取失败"

              };

            }


            // =====================================
            // S&P 500
            // =====================================

            let sp500;


            try {

              sp500 =
                await yahoo("^GSPC");

            }
            catch(error) {

              console.error(
                "S&P 500失败:",
                error.message
              );


              sp500 = {

                symbol: "^GSPC",

                price: 0,

                change: 0,

                marketStatus:
                  "数据获取失败"

              };

            }


            // =====================================
            // 加密货币
            // =====================================

            const crypto = [];


            for (
              const symbol
              of [
                "BTC",
                "ETH",
                "BNB"
              ]
            ) {

              try {

                const item =
                  await binance(symbol);


                console.log(
                  "加密货币:",
                  symbol,
                  item.price,
                  item.change
                );


                crypto.push(item);

              }
              catch(error) {

                console.error(
                  "Binance失败:",
                  symbol,
                  error.message
                );


                crypto.push({

                  symbol,

                  price: 0,

                  change: 0

                });

              }

            }


            // =====================================
            // OKB
            // =====================================

            try {

              const okb =
                await okxOKB();


              console.log(
                "OKB:",
                okb.price,
                okb.change
              );


              crypto.push(okb);

            }
            catch(error) {

              console.error(
                "OKB失败:",
                error.message
              );


              crypto.push({

                symbol: "OKB",

                price: 0,

                change: 0

              });

            }


            // =====================================
            // 找出股票市场状态
            // =====================================

            let marketStatus =
              "美股休市";


            for (
              const stock
              of stocks
            ) {

              if (
                stock.marketState ===
                "REGULAR"
              ) {

                marketStatus =
                  "美股交易中";

                break;

              }

              if (
                stock.marketState ===
                "PRE"
              ) {

                marketStatus =
                  "美股盘前";

              }

              if (
                stock.marketState ===
                "POST"
              ) {

                marketStatus =
                  "美股盘后";

              }

            }


            // =====================================
            // 最终数据
            // =====================================

            const output = {

              success: true,

              updatedAt:
                new Date().toISOString(),

              marketStatus,

              stocks,

              indices: {

                nasdaq,

                sp500

              },

              crypto

            };


            // =====================================
            // 写入 data.json
            // =====================================

            fs.writeFileSync(

              "data.json",

              JSON.stringify(
                output,
                null,
                2
              ) + "\n"

            );


            console.log(
              "================================="
            );

            console.log(
              "行情数据已经写入 data.json"
            );

            console.log(
              "市场状态:",
              marketStatus
            );

            console.log(
              "================================="
            );

          }


          main()
            .catch(error => {

              console.error(
                error
              );

              process.exit(1);

            });


          EOF


      # =========================================
      # 提交 data.json
      # =========================================

      - name: Commit updated data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit \
              -m "Update market data"

          git push
