name: Update Market Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        run: |
          node <<'EOF'
          const fs = require("fs");

          async function getYahoo(symbol) {
            const url =
              "https://query1.finance.yahoo.com/v8/finance/chart/" +
              encodeURIComponent(symbol) +
              "?interval=1m&range=1d&includePrePost=true";

            const response = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0"
              }
            });

            if (!response.ok) {
              throw new Error(`${symbol} HTTP ${response.status}`);
            }

            const json = await response.json();

            if (
              !json.chart ||
              !json.chart.result ||
              !json.chart.result[0]
            ) {
              throw new Error(`${symbol} invalid Yahoo response`);
            }

            const meta = json.chart.result[0].meta;

            return {
              symbol: meta.symbol || symbol,
              price:
                meta.regularMarketPrice ??
                meta.postMarketPrice ??
                meta.preMarketPrice ??
                null,
              previousClose:
                meta.previousClose ??
                meta.chartPreviousClose ??
                null,
              marketTime: meta.regularMarketTime
                ? new Date(meta.regularMarketTime * 1000).toISOString()
                : null,
              timezone:
                meta.exchangeTimezoneName || "America/New_York",
              exchange:
                meta.exchangeName || "",
              marketState:
                meta.marketState || ""
            };
          }

          function changePercent(price, previousClose) {
            if (
              price === null ||
              previousClose === null ||
              previousClose === 0
            ) {
              return null;
            }

            return ((price - previousClose) / previousClose) * 100;
          }

          function round(value, digits = 2) {
            if (value === null || value === undefined) {
              return null;
            }

            return Number(Number(value).toFixed(digits));
          }

          async function main() {
            const stockSymbols = [
              "NVDA",
              "TSLA",
              "AAPL",
              "MSTR",
              "STRC"
            ];

            const stockResults = [];

            for (const symbol of stockSymbols) {
              try {
                const q = await getYahoo(symbol);

                stockResults.push({
                  symbol,
                  price: round(q.price, 2),
                  change: round(
                    changePercent(q.price, q.previousClose),
                    2
                  )
                });
              } catch (error) {
                console.log(`Stock ${symbol} failed: ${error.message}`);

                stockResults.push({
                  symbol,
                  price: null,
                  change: null
                });
              }
            }

            let nasdaq = null;
            let sp500 = null;

            try {
              const q = await getYahoo("^IXIC");

              nasdaq = {
                symbol: "^IXIC",
                price: round(q.price, 2),
                change: round(
                  changePercent(q.price, q.previousClose),
                  2
                )
              };
            } catch (error) {
              console.log(`NASDAQ failed: ${error.message}`);
            }

            try {
              const q = await getYahoo("^GSPC");

              sp500 = {
                symbol: "^GSPC",
                price: round(q.price, 2),
                change: round(
                  changePercent(q.price, q.previousClose),
                  2
                )
              };
            } catch (error) {
              console.log(`S&P 500 failed: ${error.message}`);
            }

            const cryptoSymbols = [
              ["BTC", "BTC-USD"],
              ["ETH", "ETH-USD"],
              ["BNB", "BNB-USD"],
              ["OKB", "OKB-USD"]
            ];

            const cryptoResults = [];

            for (const [name, yahooSymbol] of cryptoSymbols) {
              try {
                const q = await getYahoo(yahooSymbol);

                cryptoResults.push({
                  symbol: name,
                  price: round(q.price, 2),
                  change: round(
                    changePercent(q.price, q.previousClose),
                    2
                  )
                });
              } catch (error) {
                console.log(
                  `Crypto ${name} failed: ${error.message}`
                );

                cryptoResults.push({
                  symbol: name,
                  price: null,
                  change: null
                });
              }
            }

            /*
             * 判断美股市场状态
             *
             * 使用纽约时间：
             * 盘前：04:00 - 09:30
             * 正常交易：09:30 - 16:00
             * 盘后：16:00 - 20:00
             * 收市：20:00 - 04:00
             *
             * 周六、周日直接显示周末
             */
            const now = new Date();

            const nyFormatter = new Intl.DateTimeFormat(
              "en-US",
              {
                timeZone: "America/New_York",
                weekday: "short",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              }
            );

            const parts = nyFormatter.formatToParts(now);

            const weekday = parts.find(
              p => p.type === "weekday"
            )?.value;

            const hour = Number(
              parts.find(p => p.type === "hour")?.value || 0
            );

            const minute = Number(
              parts.find(p => p.type === "minute")?.value || 0
            );

            const totalMinutes = hour * 60 + minute;

            let marketStatus = "美股收市";

            if (
              weekday === "Sat" ||
              weekday === "Sun"
            ) {
              marketStatus = "周末";
            } else if (
              totalMinutes >= 240 &&
              totalMinutes < 570
            ) {
              marketStatus = "美股盘前";
            } else if (
              totalMinutes >= 570 &&
              totalMinutes < 960
            ) {
              marketStatus = "美股交易中";
            } else if (
              totalMinutes >= 960 &&
              totalMinutes < 1200
            ) {
              marketStatus = "美股盘后";
            } else {
              marketStatus = "美股收市";
            }

            const data = {
              success: true,

              updatedAt: new Date().toISOString(),

              marketStatus,

              stocks: stockResults,

              indices: {
                nasdaq,
                sp500
              },

              crypto: cryptoResults
            };

            fs.writeFileSync(
              "data.json",
              JSON.stringify(data, null, 2),
              "utf8"
            );

            console.log(
              "Market data updated successfully."
            );

            console.log(
              JSON.stringify(data, null, 2)
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update market data"
            git push
          fi
