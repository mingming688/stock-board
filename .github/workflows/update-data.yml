name: Update Market Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        env:
          TZ: Asia/Shanghai
        run: |

          node <<'EOF'

          const fs = require("fs");

          // =========================
          // 通用 JSON 请求
          // =========================

          async function getJSON(url) {

            const response = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0"
              }
            });

            if (!response.ok) {
              throw new Error(
                `${response.status} ${response.statusText}`
              );
            }

            return await response.json();
          }


          // =========================
          // Yahoo Finance
          // 美股 / NASDAQ / S&P500
          // =========================

          async function yahoo(symbol) {

            const url =
              "https://query1.finance.yahoo.com/v8/finance/chart/" +
              encodeURIComponent(symbol) +
              "?range=1d&interval=1m";

            const data =
              await getJSON(url);

            const result =
              data.chart.result[0];

            const meta =
              result.meta;

            const price =
              Number(meta.regularMarketPrice);

            const previous =
              Number(
                meta.previousClose ||
                meta.chartPreviousClose
              );

            let change = 0;

            if (previous) {

              change =
                ((price - previous) / previous) * 100;

            }

            return {

              symbol,

              price,

              change,

              previousClose:
                previous,

              marketState:
                meta.marketState || ""

            };

          }


          // =========================
          // OKX 加密货币
          // BTC / ETH / BNB / OKB
          // =========================

          async function okx(symbol) {

            const url =
              "https://www.okx.com/api/v5/market/ticker?instId=" +
              symbol +
              "-USDT";

            const response =
              await getJSON(url);

            if (
              !response.data ||
              !response.data.length
            ) {

              throw new Error(
                "OKX没有返回数据"
              );

            }

            const item =
              response.data[0];

            const price =
              Number(item.last);

            const open =
              Number(item.open24h);

            let change = 0;

            if (open) {

              change =
                ((price - open) / open) * 100;

            }

            return {

              symbol,

              price,

              change

            };

          }


          // =========================
          // 美股市场状态
          // =========================

          function getMarketStatus(stock) {

            const state =
              stock.marketState || "";

            if (
              state === "REGULAR"
            ) {

              return "美股交易中";

            }

            if (
              state === "PRE"
            ) {

              return "美股盘前";

            }

            if (
              state === "POST"
            ) {

              return "美股盘后";

            }

            return "美股休市";

          }


          // =========================
          // 主程序
          // =========================

          async function main() {

            console.log(
              "================================"
            );

            console.log(
              "开始获取最新行情"
            );

            console.log(
              new Date().toISOString()
            );

            console.log(
              "================================"
            );


            // =========================
            // 美股
            // =========================

            const stockSymbols = [

              "NVDA",
              "TSLA",
              "AAPL",
              "MSTR",
              "STRC"

            ];

            const stocks = [];


            for (
              const symbol of stockSymbols
            ) {

              try {

                const item =
                  await yahoo(symbol);

                console.log(
                  `${symbol}: ${item.price} ${item.change}`
                );

                stocks.push(item);

              }
              catch(error) {

                console.error(
                  "股票获取失败:",
                  symbol,
                  error.message
                );

                stocks.push({

                  symbol,

                  price: 0,

                  change: 0,

                  previousClose: 0,

                  marketState: ""

                });

              }

            }


            // =========================
            // NASDAQ
            // =========================

            let nasdaq;

            try {

              nasdaq =
                await yahoo("^IXIC");

            }
            catch(error) {

              console.error(
                "NASDAQ获取失败:",
                error.message
              );

              nasdaq = {

                symbol: "^IXIC",

                price: 0,

                change: 0

              };

            }


            // =========================
            // S&P 500
            // =========================

            let sp500;

            try {

              sp500 =
                await yahoo("^GSPC");

            }
            catch(error) {

              console.error(
                "S&P500获取失败:",
                error.message
              );

              sp500 = {

                symbol: "^GSPC",

                price: 0,

                change: 0

              };

            }


            // =========================
            // 加密货币
            // 全部改成 OKX
            // =========================

            const cryptoSymbols = [

              "BTC",
              "ETH",
              "BNB",
              "OKB"

            ];

            const crypto = [];


            for (
              const symbol of cryptoSymbols
            ) {

              try {

                const item =
                  await okx(symbol);

                console.log(
                  `${symbol}: ${item.price} ${item.change}`
                );

                crypto.push(item);

              }
              catch(error) {

                console.error(
                  "OKX获取失败:",
                  symbol,
                  error.message
                );

                crypto.push({

                  symbol,

                  price: 0,

                  change: 0

                });

              }

            }


            // =========================
            // 市场状态
            // =========================

            const marketStatus =
              getMarketStatus(
                stocks[0]
              );


            console.log(
              "市场状态:",
              marketStatus
            );


            // =========================
            // 当前时间
            // =========================

            const updatedAt =
              new Date().toISOString();


            // =========================
            // 读取旧 data.json
            // =========================

            let oldData = {};

            try {

              if (
                fs.existsSync("data.json")
              ) {

                oldData =
                  JSON.parse(
                    fs.readFileSync(
                      "data.json",
                      "utf8"
                    )
                  );

              }

            }
            catch(error) {

              console.log(
                "读取旧数据失败，重新建立"
              );

            }


            // =========================
            // 历史记录
            // =========================

            let history =
              Array.isArray(
                oldData.history
              )
                ? oldData.history
                : [];


            const snapshot = {

              timestamp:
                updatedAt,

              stocks:
                stocks.map(item => ({

                  symbol:
                    item.symbol,

                  price:
                    item.price,

                  change:
                    item.change

                })),

              indices: {

                nasdaq: {

                  price:
                    nasdaq.price,

                  change:
                    nasdaq.change

                },

                sp500: {

                  price:
                    sp500.price,

                  change:
                    sp500.change

                }

              },

              crypto:
                crypto.map(item => ({

                  symbol:
                    item.symbol,

                  price:
                    item.price,

                  change:
                    item.change

                }))

            };


            history.push(
              snapshot
            );


            // 最多保存120条
            if (
              history.length > 120
            ) {

              history =
                history.slice(-120);

            }


            console.log(
              "历史记录数量:",
              history.length
            );


            // =========================
            // 最终数据
            // =========================

            const output = {

              success: true,

              updatedAt,

              marketStatus,

              stocks,

              indices: {

                nasdaq,

                sp500

              },

              crypto,

              history

            };


            // =========================
            // 写入 data.json
            // =========================

            fs.writeFileSync(

              "data.json",

              JSON.stringify(
                output,
                null,
                2
              ) + "\n"

            );


            console.log(
              "================================"
            );

            console.log(
              "行情数据已经写入 data.json"
            );

            console.log(
              "历史记录:",
              history.length,
              "条"
            );

            console.log(
              "================================"
            );

          }


          main().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF


      # =========================
      # 提交数据
      # =========================

      - name: Commit updated data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update market data"

          git push
