name: Update Market Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        env:
          TZ: Asia/Shanghai
        run: |
          node <<'EOF'
          const fs = require("fs");

          async function getJSON(url) {
            const response = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0",
                "Accept": "application/json"
              }
            });

            if (!response.ok) {
              throw new Error(
                `${response.status} ${response.statusText} ${url}`
              );
            }

            return await response.json();
          }

          // =========================
          // Yahoo Finance
          // =========================
          async function yahoo(symbol) {
            const url =
              "https://query1.finance.yahoo.com/v8/finance/chart/" +
              encodeURIComponent(symbol) +
              "?range=1d&interval=1m";

            const data = await getJSON(url);

            const result = data.chart.result[0];
            const meta = result.meta;

            const price = Number(meta.regularMarketPrice);

            const previous = Number(
              meta.previousClose ||
              meta.chartPreviousClose
            );

            const change = previous
              ? ((price - previous) / previous) * 100
              : 0;

            return {
              symbol,
              price,
              change
            };
          }

          // =========================
          // CoinGecko Crypto
          // =========================
          async function getCrypto() {
            const url =
              "https://api.coingecko.com/api/v3/simple/price" +
              "?ids=bitcoin,ethereum,binancecoin" +
              "&vs_currencies=usd" +
              "&include_24hr_change=true";

            const data = await getJSON(url);

            return [
              {
                symbol: "BTC",
                price: Number(data.bitcoin.usd),
                change: Number(data.bitcoin.usd_24h_change || 0)
              },
              {
                symbol: "ETH",
                price: Number(data.ethereum.usd),
                change: Number(data.ethereum.usd_24h_change || 0)
              },
              {
                symbol: "BNB",
                price: Number(data.binancecoin.usd),
                change: Number(data.binancecoin.usd_24h_change || 0)
              }
            ];
          }

          // =========================
          // OKB - OKX
          // =========================
          async function okxOKB() {
            const url =
              "https://www.okx.com/api/v5/market/ticker?instId=OKB-USDT";

            const response = await getJSON(url);

            if (
              !response.data ||
              !response.data.length
            ) {
              throw new Error("OKX returned no data");
            }

            const item = response.data[0];

            const price = Number(item.last);
            const open = Number(item.sodUtc0);

            let change = 0;

            if (open) {
              change =
                ((price - open) / open) * 100;
            }

            return {
              symbol: "OKB",
              price,
              change
            };
          }

          // =========================
          // Main
          // =========================
          async function main() {

            console.log("开始获取行情...");

            // -------------------------
            // 股票
            // -------------------------
            const stocks = [];

            const stockSymbols = [
              "NVDA",
              "TSLA",
              "AAPL",
              "MSTR",
              "STRC"
            ];

            for (const symbol of stockSymbols) {

              try {

                const item = await yahoo(symbol);

                console.log(
                  "股票成功:",
                  symbol,
                  item
                );

                stocks.push(item);

              } catch (error) {

                console.error(
                  "股票失败:",
                  symbol,
                  error.message
                );

                stocks.push({
                  symbol,
                  price: 0,
                  change: 0
                });
              }
            }

            // -------------------------
            // NASDAQ
            // -------------------------
            let nasdaq;

            try {

              nasdaq = await yahoo("^IXIC");

              console.log(
                "NASDAQ:",
                nasdaq
              );

            } catch (error) {

              console.error(
                "NASDAQ失败:",
                error.message
              );

              nasdaq = {
                symbol: "^IXIC",
                price: 0,
                change: 0
              };
            }

            // -------------------------
            // S&P 500
            // -------------------------
            let sp500;

            try {

              sp500 = await yahoo("^GSPC");

              console.log(
                "S&P 500:",
                sp500
              );

            } catch (error) {

              console.error(
                "S&P 500失败:",
                error.message
              );

              sp500 = {
                symbol: "^GSPC",
                price: 0,
                change: 0
              };
            }

            // -------------------------
            // 加密货币
            // -------------------------
            let crypto = [];

            try {

              crypto = await getCrypto();

              console.log(
                "CoinGecko Crypto:",
                crypto
              );

            } catch (error) {

              console.error(
                "CoinGecko失败:",
                error.message
              );

              // 如果 API 暂时失败，
              // 尝试保留上一次的数据
              try {

                const oldData =
                  JSON.parse(
                    fs.readFileSync(
                      "data.json",
                      "utf8"
                    )
                  );

                crypto =
                  Array.isArray(oldData.crypto)
                    ? oldData.crypto.filter(
                        item =>
                          ["BTC", "ETH", "BNB"]
                            .includes(item.symbol)
                      )
                    : [];

              } catch (e) {

                crypto = [];
              }
            }

            // -------------------------
            // OKB
            // -------------------------
            try {

              const okb =
                await okxOKB();

              console.log(
                "OKB:",
                okb
              );

              crypto.push(okb);

            } catch (error) {

              console.error(
                "OKB失败:",
                error.message
              );

              // 保留旧 OKB 数据
              try {

                const oldData =
                  JSON.parse(
                    fs.readFileSync(
                      "data.json",
                      "utf8"
                    )
                  );

                const oldOKB =
                  Array.isArray(oldData.crypto)
                    ? oldData.crypto.find(
                        item =>
                          item.symbol === "OKB"
                      )
                    : null;

                if (oldOKB) {
                  crypto.push(oldOKB);
                }

              } catch (e) {
                console.error(
                  "读取旧 OKB 数据失败"
                );
              }
            }

            // -------------------------
            // 输出
            // -------------------------
            const output = {

              success: true,

              updatedAt:
                new Date().toISOString(),

              stocks,

              indices: {
                nasdaq,
                sp500
              },

              crypto
            };

            fs.writeFileSync(
              "data.json",
              JSON.stringify(
                output,
                null,
                2
              ) + "\n"
            );

            console.log(
              "================================"
            );

            console.log(
              "行情数据已经写入 data.json"
            );

            console.log(
              JSON.stringify(
                output,
                null,
                2
              )
            );

            console.log(
              "================================"
            );
          }

          main().catch(error => {

            console.error(
              "程序运行失败:",
              error
            );

            process.exit(1);
          });

          EOF

      - name: Commit updated data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Update market data"

          git push
