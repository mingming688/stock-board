<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>股票钉盘 V2</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080a0d;color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
*{box-sizing:border-box}
#app{min-height:100vh;padding:10px 13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #272c34;padding-bottom:8px;margin-bottom:3px}
.title{font-size:21px;font-weight:700}.sub{font-size:9px;color:#7f8996;margin-top:2px}
#clock{text-align:right;font-size:12px;color:#aab2bd;line-height:1.3}
.row{display:flex;align-items:center;height:48px;border-bottom:1px solid #1c2026}
.sym{width:22%;font-size:18px;font-weight:700}.pr{width:40%;text-align:right;font-size:18px;font-weight:700}
.ch{width:38%;text-align:right;font-size:16px;font-weight:700}
.up{color:#22c77a}.down{color:#ff5964}.flat{color:#aab2bd}
.indexbox{display:flex;justify-content:space-between;gap:10px;padding:9px 2px 7px;border-bottom:1px solid #1c2026}
.idx{flex:1}.idxname{font-size:11px;color:#89929e}.idxval{font-size:14px;font-weight:700;margin-top:2px}
.status{text-align:center;font-size:9px;color:#68717d;margin-top:7px}
</style></head>
<body><div id="app">
<div class="head"><div><div class="title">美股行情</div><div class="sub">iPhone 6 Plus · 自动更新</div></div><div id="clock">--:--:--</div></div>
<div id="rows"></div>
<div class="indexbox">
  <div class="idx"><div class="idxname">NASDAQ</div><div id="ndx" class="idxval flat">--</div></div>
  <div class="idx" style="text-align:right"><div class="idxname">S&amp;P 500</div><div id="spx" class="idxval flat">--</div></div>
</div>
<div id="marketStatus" class="status">正在判断市场状态…</div>
<div id="status" class="status">正在获取行情…</div>
</div>
<script>
(function(){
var stocks=[
 {s:"NVDA",id:"105.NVDA"},{s:"TSLA",id:"105.TSLA"},{s:"AAPL",id:"105.AAPL"},
 {s:"MSTR",id:"105.MSTR"},{s:"STRC",id:"105.STRC"}
];
var latest={};
function fmtPrice(v){return isFinite(v)?"$"+Number(v).toFixed(2):"--";}
function fmtPct(v){if(!isFinite(v))return"--";var n=Number(v);return(n>0?"+":"")+n.toFixed(2)+"%";}
function pctClass(v){return v>0?"up":(v<0?"down":"flat");}
function draw(){
 var h="";
 for(var i=0;i<stocks.length;i++){
  var k=stocks[i].s,d=latest[k]||{},v=d.price,p=d.pct;
  h+='<div class="row"><div class="sym">'+k+'</div><div class="pr">'+fmtPrice(v)+'</div><div class="ch '+pctClass(p)+'">'+(p>0?"▲ ":p<0?"▼ ":"")+fmtPct(p)+'</div></div>';
 }
 document.getElementById("rows").innerHTML=h;
}
function receiveStock(name,data){
 if(!data)return;
 latest[name]={price:Number(data.f43)/1000,pct:Number(data.f170)/100};
 draw();
}
function receiveIndex(id,data){
 if(!data)return;
 var price=Number(data.f43)/1000,p=Number(data.f170)/100;
 var el=document.getElementById(id);
 el.className="idxval "+pctClass(p);
 el.innerHTML=(isFinite(price)?Number(price).toFixed(2):"--")+" "+(p>0?"▲ ":p<0?"▼ ":"")+fmtPct(p);
}
function jsonp(url,handler){
 var sc=document.createElement("script"),cb="cb_"+new Date().getTime()+"_"+Math.floor(Math.random()*100000);
 window[cb]=function(json){try{handler(json&&json.data);}finally{try{delete window[cb];}catch(e){window[cb]=null;}if(sc.parentNode)sc.parentNode.removeChild(sc);}};
 sc.src=url+"&cb="+cb+"&_="+new Date().getTime();
 document.body.appendChild(sc);
}
function load(){
 for(var i=0;i<stocks.length;i++){
  (function(item){
   jsonp("https://push2.eastmoney.com/api/qt/stock/get?secid="+encodeURIComponent(item.id)+"&fields=f43,f57,f58,f60,f170",function(d){receiveStock(item.s,d);});
  })(stocks[i]);
 }
 jsonp("https://push2.eastmoney.com/api/qt/stock/get?secid=100.NDX&fields=f43,f57,f58,f60,f170",function(d){receiveIndex("ndx",d);});
 jsonp("https://push2.eastmoney.com/api/qt/stock/get?secid=100.SPX&fields=f43,f57,f58,f60,f170",function(d){receiveIndex("spx",d);});
 document.getElementById("status").innerHTML="最后更新 · "+new Date().toLocaleTimeString();
}
function clock(){
 var d=new Date(),h=("0"+d.getHours()).slice(-2),m=("0"+d.getMinutes()).slice(-2),s=("0"+d.getSeconds()).slice(-2);
 document.getElementById("clock").innerHTML=h+":"+m+":"+s;
}
function market(){
 var d=new Date(),day=d.getDay(),h=d.getHours(),m=d.getMinutes(),t=h*60+m;
 var el=document.getElementById("marketStatus");
 if(day===0||day===6){el.innerHTML="美股休市 · 周末";return;}
 el.innerHTML="美股行情看板 · 北京时间 "+(("0"+h).slice(-2))+":"+(("0"+m).slice(-2));
}
clock();market();draw();load();
setInterval(clock,1000);setInterval(market,30000);setInterval(load,30000);
})();
</script></body></html>
